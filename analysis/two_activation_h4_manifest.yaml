schema: matching-one.two-activation-h4.manifest.v1
status: retrospective_existing_data_reanalysis
description: >-
  Reinterpret the frozen threshold ranks as the two exact homology activations
  K1=K_minus and K2=K_plus.  No new Monte Carlo samples are generated and no
  exponent is fitted.

semantic_contract:
  K1: K_minus
  K2: K_plus
  F1: E[Pr(Binomial(N,p) >= K1)]
  F2: E[Pr(Binomial(N,p) >= K2)]
  matching_curve: M(p) = -1 + F1(p) + F2(p)
  pooled_root: >-
    The zero of the equal-weight mean of the two orientation matching curves;
    it is recomputed inside every aligned delete-one-batch replicate.
  angular_normalization: exact Delta cos(4 theta) for the declared Gaussian-integer representatives
  inference_boundary: >-
    Per-size decomposition only.  No free exponent fit and no multiplication
    of evidence across archives that share a dependency_group.

required_sizes: [65, 85, 130, 145, 170, 185, 265, 290, 325, 425]

runs:
  - N: 65
    histogram: results/server-20260828/P45-root-amplitude/n65.hist.csv
    moments: results/server-20260828/P45-root-amplitude/n65.moments.csv
    metadata: results/server-20260828/P45-root-amplitude/n65.metadata.json
    dependency_group: crn-2026104501-5000000000-5100000000
    expected_first: [8, 1]
    expected_second: [7, 4]
  - N: 85
    histogram: results/server-20260828/P45-root-amplitude/n85.hist.csv
    moments: results/server-20260828/P45-root-amplitude/n85.moments.csv
    metadata: results/server-20260828/P45-root-amplitude/n85.metadata.json
