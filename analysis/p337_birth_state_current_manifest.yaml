  - per_replica_cross_orientation_identity
  - cross_archive_sample_covariance_with_ten_size_Etop_or_Euler

claim_boundary:
  - This reanalysis creates no new Monte Carlo samples and no new independent evidence groups.
  - A nonzero age score rejects lumpability of the retained coarse state but does not distinguish intrinsic memory from unrecorded current geometry.
  - Collision current is a line-free state transition and cannot be relabelled as a third charged projective component.
  - Nonzero state currents do not identify Q4, a Jordan block, a field or a free exponent.
