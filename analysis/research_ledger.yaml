version: 2
updated: 2026-08-29
purpose: >
  Machine-readable map of long-lived research questions, canonical evidence,
  existing-data analysis, and genuinely new production. docs/STATUS.md remains
  the authoritative claim ledger; this file records relationships and work state.

canonical_views:
  overview: README.md
  claim_ledger: docs/STATUS.md
  research_map: docs/RESEARCH-MAP.md
  execution_synthesis: notes/SYNTHESIS-20260828.md
  roadmap: docs/ROADMAP.md
  artifact_registry: analysis/artifact_registry.yaml
  reproducibility: REPRODUCIBILITY.md
  governance: GOVERNANCE.md

status_vocabulary:
  exact: finite identity, exact arithmetic, or deterministic theorem/check
  observed: direct numerical observation with declared uncertainty
  predictive: frozen, held-out, prospective, or independently reproduced finite-size evidence
  mechanism_candidate: interpretation supported by several facts but not uniquely identified
  negative_result: frozen/bounded hypothesis or method gate failed
  analysis_ready: required data already exist; no major new simulation is required
  new_compute: requires a new target run or exact enumeration
  gated: do not start production until named prerequisites are satisfied
  historical_snapshot: accurate record of an earlier project state
  frontier_open: useful work remains on an unmerged branch/PR and is not canonical main evidence

