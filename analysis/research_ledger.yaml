maintenance_rules:
  - Existing-data analysis, exact work and pilots are allowed by default.
  - Preserve frozen chronology and committed results.
  - Apply typed semantics only where a claim-bearing comparison needs them.
  - Count a raw random block once in cumulative evidence unless a joint construction says otherwise.
  - Prefer a new information axis over another unconstrained fit parameter.
