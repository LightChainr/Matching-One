  objective: one_prospective_birth_current_to_global_U_transmission_decision
  keep_live_issues: [334, 154]
  keep_live_limit: 4
  model_family:
    M0: lifecycle_current_only
    M1: contact_regulated_current
    M2: extra_transfer_coordinate_only_if_frozen_before_validation
  transmission_chain:
    - microscopic_source_or_contact
    - ingress_egress_birth_currents
    - J_grad
    - d_p_E_top
    - pooled_root_slope_normalized_U
  diagnostic_only:
