maintenance_rules:
  - Preserve frozen predictions and old result artifacts after interpretation changes.
  - Add an evidence block before upgrading a project-level claim.
  - Do not count multiple derived views of one random block as independent evidence.
  - Compare channel-bearing observables only through identical typed descriptors or a registered exact map.
  - Prefer a new geometry, multiplier, observable, or control over adding an unconstrained fit parameter.
  - Mark old queues and syntheses as historical snapshots instead of deleting them.
