version: 3
updated: 2026-08-29
purpose: >
  Machine-readable map of long-lived research questions, canonical evidence,
  existing-data analysis and new production. This ledger ranks work; it does
  not grant permission to start it. docs/STATUS.md remains the claim ledger.

canonical_views:
  overview: README.md
  claim_ledger: docs/STATUS.md
  research_map: docs/RESEARCH-MAP.md
  execution_synthesis: notes/SYNTHESIS-20260828.md
  roadmap: docs/ROADMAP.md
  artifact_registry: analysis/artifact_registry.yaml
  reproducibility: REPRODUCIBILITY.md
  governance: GOVERNANCE.md

status_vocabulary:
  exact: finite identity, exact arithmetic, or deterministic theorem/check
  observed: direct numerical observation with declared uncertainty
  predictive: frozen, held-out, prospective, or independently reproduced finite-size evidence
  mechanism_candidate: interpretation supported by several facts but not uniquely identified
  negative_result: frozen/bounded hypothesis or method failed
  analysis_ready: existing data are enough to proceed now
  active: highest expected information now
  ready: useful work that may start whenever resources are available
  later: lower expected information per cost at present, not blocked
  historical: retained provenance rather than an active entrypoint

hard_constraints:
  - preserve_frozen_predictions_and_committed_result_history
  - require_identical_observable_semantics_or_a_registered_exact_map_for_claim_bearing_scores
  - do_not_add_correlated_views_of_one_raw_random_block_as_independent_primary_evidence

