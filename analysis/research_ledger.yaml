version: 6
updated: 2026-08-29
purpose: >
  Compact machine-readable map of durable evidence, live hypotheses and default
  research attention. Priority is advisory: it does not lock tasks, forbid
  parallel work, require branch consolidation or imply scientific rejection.

canonical_views:
  overview: README.md
  next_targets: docs/NEXT-TARGETS.md
  claim_ledger: docs/STATUS.md
  research_map: docs/RESEARCH-MAP.md
  roadmap: docs/ROADMAP.md
  execution_synthesis: notes/SYNTHESIS-20260828.md
  artifact_registry: analysis/artifact_registry.yaml
  reproducibility: REPRODUCIBILITY.md
  governance: GOVERNANCE.md

priority_policy:
  - priority_is_attention_not_permission
  - no_task_locking_from_this_ledger
  - no_branch_merge_requirement
  - preserve_competing_hypotheses_until_discriminated
  - lower_priority_is_not_rejection
  - raise_priority_when_new_independent_information_becomes_available

evidence_integrity_rules:
  - preserve_frozen_predictions_and_committed_result_history
  - require_identical_observable_semantics_or_a_registered_exact_map_for_claim_bearing_scores
  - do_not_add_correlated_views_of_one_raw_random_block_as_independent_primary_evidence

