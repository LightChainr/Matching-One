    statement: Wrapping-only GLS gave 1x gain because relevant matching-difference channels are configuration-identical.
    preserve_under: results/server-20260828/C03-euler
  - id: NR_PADE
    statement: Padé/rational Stage A did not cure the positive increasing finite-width residual drift.
    preserve_under: results/server-20260828
  - id: NR_BARE_SLOPE
    statement: Bare finite-size center-slope ratio equal to exactly 2^(3/8) is rejected at current precision.
