version: 9
updated: 2026-08-29
purpose: >
  Compact map of durable evidence and next information axes. This ranks work;
  it does not grant permission. The advisory lifecycle overlay records actual
  maturity and the next missing input without locking or closing any task.

canonical_views:
  overview: README.md
  next_targets: docs/NEXT-TARGETS.md
  claim_ledger: docs/STATUS.md
  research_map: docs/RESEARCH-MAP.md
  historical_synthesis: notes/SYNTHESIS-20260828.md
  roadmap: docs/ROADMAP.md
  artifact_registry: analysis/artifact_registry.yaml
  reproducibility: REPRODUCIBILITY.md
  governance: GOVERNANCE.md

hard_constraints:
  - preserve_frozen_predictions_and_committed_result_history
  - require_identical_observable_semantics_or_a_registered_exact_map_for_claim_bearing_scores
  - do_not_add_correlated_views_of_one_raw_random_block_as_independent_primary_evidence

team_coordination_signals:
  - id: CS_LIVE_LIFECYCLE_DRIFT
    action: compare_live_PR_heads_states_and_latest_main_to_the_registry_at_start_and_end_of_each_work_block
    reason: navigation_should_change_when_results_land_not_wait_for_a_later_cleanup
  - id: CS_LIFECYCLE_TUPLE
    action: publish_input_status_output_status_snapshot_commit_and_base_or_parent_with_each_result
    reason: branch_only_inputs_open_PR_outputs_stacked_results_and_main_facts_are_distinct
  - id: CS_DEPENDENCY_COORDINATOR
    action: assign_one_covariance_bundle_and_statistical_coordinator_per_raw_random_block
    reason: parallel_derived_views_are_coordinates_not_independent_votes
  - id: CS_SHARED_RANK_BIRTH_STREAM
    action: reuse_the_index8_cached_topology_oracle_and_acquire_q_I01_I12_ell_iota_line_landing_SD_qJ_K1_K2_once_in_aligned_batches
    reason: one_sufficient_stream_supports_parallel_mechanism_analyses_without_incomparable_production
  - id: CS_TYPED_C3_MANIFEST
    action: name_the_observer_sector_and_complex_character_in_each_C3_title_and_manifest
    reason: distinct_typed_rows_add_more_information_than_repeating_the_ordinary_A_top_selector
  - id: CS_SHARED_CONTEXT_AND_Q_INTERFACES
    action: use_common_source_readout_batch_schemas_for_Gaussian_annulus_and_measure_projector_field_Pascal_interfaces_for_Q_tangents
    reason: shared_semantics_turn_parallel_work_into_a_scoreable_rectangle_or_tangent

frontier_schema:
  integration_statuses: [main_integrated, open_pr, branch_only, hypothesis]
  states:
    - finite_topological_state
    - continuum_module
    - low_dimensional_dynamics
    - microscopic_threshold_structure
  sources:
    - bernoulli_thermal
    - potts_Q_measure
    - projector_derivative
    - explicit_operator_derivative
    - rank_birth_geometric_tilt
    - relative_cluster_fugacity
    - deck_charge
    - boundary_source
  geometries:
    - gaussian_cover
    - annulus
    - moduli_hecke_child
    - boundary_cross_ratio
    - triangular_control
    - square_controls
    - finite_transfer_cylinder
  acquisitions: [existing_data_reuse, exact_construction, small_pilot, new_production]
  information_gain: [very_high, high, medium]
  compute_cost: [none, low, moderate, high]

observer_sectors:
  - id: global_unmarked
    name: global_unmarked_endpoint
    semantic_boundary: regular_unlabelled_zero_leg_endpoint_only
  - id: global_rank_projector
    name: global_rank_plane_projector
    semantic_boundary: P0_P1_P2_and_A_top_or_E_top_covector_must_be_declared
  - id: topology_typed
    name: typed_homology_or_connectivity_sector
    semantic_boundary: subgroup_and_combination_must_be_declared
  - id: local_pivotal
    name: local_or_landing_marked_pivotal
    semantic_boundary: marked_location_and_radius_are_part_of_the_observable
  - id: rank_birth_local
    name: rank_birth_gate_line_index_and_landing_mark
    semantic_boundary: I01_I12_direct_birth_ell_iota_and_line_or_landing_H4_are_distinct_fields
  - id: matching_odd
    name: matching_exchange_odd_readout
    semantic_boundary: matching_parity_is_not_a_Potts_charge_label
  - id: matching_even
    name: matching_exchange_even_readout
    semantic_boundary: even_and_odd_combinations_from_one_stream_are_correlated_coordinates
  - id: deck_charged
    name: nontrivial_cover_character
    semantic_boundary: transported_character_basis_and_conjugation_pair_are_part_of_the_observable
  - id: boundary
    name: boundary_connectivity_or_crossing
    semantic_boundary: event_partition_and_cross_ratio_are_part_of_the_observable
  - id: cross_microscopic
    name: matched_dimensionless_cross_lattice_statistic
    semantic_boundary: raw_amplitudes_are_not_universal_without_metric_cancellation
  - id: bulk_energy_logpair
    name: bulk_energy_and_top_partner_readout
    semantic_boundary: field_gauge_and_cutoff_normalization_are_part_of_the_observable

