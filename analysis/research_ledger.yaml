  stop_rule: >
    A failed validation demotes or eliminates the frozen model. Do not add a
    feature on the same validation block. If #154 cannot freeze a
    distinguishable prospective U prediction before new data, do not run a
    fresh target block. Do not open a third P0 during this decision.
  fallback_boundary: write_current_C3_finite_size_phenomenology_without_operator_identification

