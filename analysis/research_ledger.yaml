maintenance_rules:
  - Integrate useful science first; refresh navigation afterward.
  - Refresh only delivery-relevant refs and integration states at handoff; do not make a whole-repository drift audit a start/end ritual.
  - Completed production, exact objects and adapters should feed the next scientific output; repeated fixtures, projected identities and readiness checks are supporting work only when that output requires them.
  - The attention order and effort hints allocate attention, not permission, quotas, issue locks or vetoes.
  - Existing-data analysis, exact work, pilots and exploratory production are allowed by default.
  - Prefer a new information axis over another unconstrained fit parameter.
  - A negative result succeeds when it removes a mechanism or compute loop.
