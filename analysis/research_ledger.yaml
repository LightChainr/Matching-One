negative_results:
  - id: NR_LARGE_PELL
    statement: Large-Pell fixed-p scans were underpowered for the target orientation gap.
    preserve_under: results/server-20260828/pell
  - id: NR_WRAPPING_GLS
    statement: Wrapping-only GLS gave 1x gain because relevant matching-difference channels are configuration-identical.
    preserve_under: results/server-20260828/C03-euler
  - id: NR_PADE
    statement: Pade/rational Stage A did not cure the positive increasing finite-width residual drift.
    preserve_under: results/server-20260828
  - id: NR_BARE_SLOPE
    statement: Bare finite-size center-slope ratio equal to exactly 2^(3/8) is rejected at current precision.
    preserve_under: results/server-20260828/P49-fullcurve-doubling-100m
  - id: NR_SPRIME_PURE
    statement: Pure P4[Sprime]~N^-5/4 fails prospectively on N185/N265.
    preserve_under: results/server-20260828/P43-heldout-fullcurve-500m
  - id: NR_COMPLEX_ZERO_RMS
    statement: Frozen global complex-zero imaginary-RMS prediction failed at exact L5.
    preserve_under: results/exact-zero-map-pilot
  - id: NR_N26_BETA
    statement: Frozen Beta(5,5) and Beta(7,7) exact finite laws both fail on N26.
    preserve_under: results/local-20260828/P115-n26-self-matching-exact
  - id: NR_GRAPH_COVER_CRN
    statement: Exact graph-cover order-statistic CRN did not materially reduce variance and is not used in norm-5 production.
    preserve_under: pull_request_130_history

maintenance_rules:
  - Preserve frozen prediction chronology and committed result history.
  - Require identical observable semantics or a registered exact map for claim-bearing scores.
  - Aggregate one raw random block once in cumulative evidence unless a joint construction says otherwise.
  - Existing-data analysis, exact work and pilots are allowed by default.
  - Treat active/ready/later as priority labels rather than permissions.
  - Prefer new information axes over adding unconstrained fit parameters.
