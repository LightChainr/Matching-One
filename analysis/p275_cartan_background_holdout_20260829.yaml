future_primary:
  name: cross_fitted_independent_clock_observer
  purpose: escape_the_rank_gate_contact_identity
  observer:
    symbol: O_ext
    definition: "(K1+K2-(N+1))/(2*(N+1))"
    meaning: centered essential_birth_clock_midpoint_of_the_complete_priority_path
    complement: odd
    reason_independent: not_a_function_of_the_instantaneous_three_state_q_at_level_k
  source_gram:
    fields: [J_D4, J_S4]
    alpha: "Cov(J_D4,J_S4)/Var(J_S4), with the complex conjugation in the second slot"
    residual: J_perp_equals_J_D4_minus_alpha_times_J_S4
    cross_fit: >-
      Inside every outer delete-one replicate, solve p on retained batches;
      train alpha on retained even batches and score odd batches, then train on
      odd and score even; average the two fold scores with fixed equal weights.
  observable:
    gamma_ext_perp: "Cov(O_ext,J_perp)/B"
    scaled: "Y_ext=N^(13/8)*phase*gamma_ext_perp"
    fixed_N_modulus_test: "Y_ext(tau)=c*F_Q4(tau)"
    Q4_shape_order_i_2i_5i_over_2: ['1', '11/4', '4.2934368543749230211109559224133052345']
    gls_coordinates: [i_Re, i_Im, 2i_Re, 2i_Im, 5i_over_2_Re, 5i_over_2_Im]
    Q4_shape_dof: 4
    zero_dof: 6
    decision: >-
      A passing nonzero Q4-shape score motivates a second size for the frozen
      N^-13/8 transfer. Failure says this O_ext/source residual does not realize
      the proposed field bridge; do not retune alpha or the modulus vector.

