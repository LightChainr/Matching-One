  - id: local_charged_insertion
    object_kind: local_charged_insertion
    definition: finite_support_tensor_or_source_with_explicit_nontrivial_internal_index_or_projector_before_global_trace_or_neutral_contraction
    example: 'C4 average of Kbar=i P_[Q-2,2] i^dagger at one vacant four-edge colour vertex'
    q1_source: 'S_av=-sum_x(t_x)/N'
    coupling_normalization: epsilon_over_N_site_average
    units: dimensionless_response_per_unit_site_average_epsilon
    completed_original_U_response: 0.0018155512845251097
    artifacts:
      - commit: 923f66b979a6b6132875f783106c041ed3c0c1a9
        path: notes/local-four-port-transmission-result.md
        integration_status: branch_only
      - path: analysis/four_leg_trace_interface.json
