schema: matching-one.p275-observable-dictionary.v1
status: frozen_existing_data_dictionary_no_new_mc
updated: '2026-09-01'
issue: 275
priority: P0
priority_semantics: attention_not_permission_or_lock

state_contract:
  geometry_scope: honest_periodic_square_cell_torus
  rank: 'r=rank image[H1(black NN)->H1(T2)] in {0,1,2}'
  q:
    formula: 'q=r-1'
    values_by_rank: {rank0: -1, rank1: 0, rank2: 1}
    units: dimensionless_configuration_scalar
  E:
    formula: 'E=q^2'
    values_by_rank: {rank0: 1, rank1: 0, rank2: 1}
    units: dimensionless_configuration_scalar
    not_equivalent_to: [continuum_energy_field, square_of_mean_q]
  normalized_rank_coordinates:
    A_top: '<q>=P2-P0'
    E_top: '<E>=P0+P2=1-P1'
    units: dimensionless_probability_contrast
  sources:
    - commit: 2da58552e261724e3862d214072a19d4a629fab9
      path: notes/digital-alexander-duality-proof.md
      integration_status: main_integrated

activation_transform:
  K1: K_minus
  K2: K_plus
  H1: '1[K>=K1]'
  H2: '1[K>=K2]'
  F1: 'E[H1]'
  F2: 'E[H2]'
  pointwise_q: '-1+H1+H2'
  pointwise_E: '1-H1+H2'
  probabilities: {P0: '1-F1', P1: 'F1-F2', P2: F2}
  expectations: {q: '-1+F1+F2', E: '1-F1+F2'}
  direction_transform:
    A_top: 'Delta4_F1+Delta4_F2'
    E_top: '-Delta4_F1+Delta4_F2'
  units:
    K1_K2: site_count
    F1_F2_A_top_E_top: dimensionless_probability_or_contrast
  not_equivalent_to:
    - two_torus_propagating_sectors
    - two_independent_evidence_rows
    - continuum_field_decomposition
  sources:
    - commit: e5f39c1d14d54fb2097fd047585f532448918f7a
      paths:
        - scripts/analyze_two_activation_h4.py
        - results/norm4-two-activation-h4/latest.json
        - results/norm4-two-activation-h4/latest.md
      integration_status: open_pr
      pr: 267

