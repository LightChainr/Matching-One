  - c++ -O3 -DNDEBUG -std=c++17 -fopenmp src/threshold_rank_integer_period_mc.cpp -o threshold_rank_integer_period_mc
  - threshold_rank_integer_period_mc --marked-births --n N --samples S --batches 20 --seed 202608290215 --replica-offset 9100000000 --threads 16 --output-prefix PREFIX
  - python3 scripts/score_marked_birth_path.py --prefix PREFIX --output SCORE.json

