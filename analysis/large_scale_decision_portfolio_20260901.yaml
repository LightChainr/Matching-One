schema: matching-one.large-scale-decision-portfolio.v1
as_of: '2026-09-01'
source_review:
  pull_request: 546
  integration_status: open_pr
  draft: true
  head: d85ff6f1c55eb766e0b04a5be556202166970c54
  role: unacquired_compute_inventory_not_automatic_run_queue

portfolio_principle: >-
  Rank candidate acquisitions by prospective nuisance-profiled model-space
  separation per projected CPU cost. Unacquired target data alone does not
  confer priority, and priority is attention rather than permission or lock.

value_of_information_contract:
  score: min_pairwise_profiled_mahalanobis_squared_per_projected_cpu_hour
  required_inputs:
    - frozen_competing_prediction_vectors
    - named_nuisance_amplitude_space
    - pilot_or_existing_joint_covariance
    - projected_runtime_and_memory
    - predeclared_model_lowering_outcome
  zero_score_conditions:
    - no_opposing_predictions
    - profiled_prediction_images_coincide
    - observable_semantics_or_normalizer_not_shared
  evidence_boundary: design_score_not_statistical_evidence

attention_order:
  - id: p275_candidate_column_completion
    class: immediate_core_analysis
    issues: [275]
    integration_status: open_issue_with_open_pr267_results
    acquisition: existing_data_first
    launchability: theory_columns_missing
    information_gain: very_high
    compute_cost_before_any_acquisition: low
    question: >-
      Do vacuum/Ward and thermal-Q4/Jordan give distinct same-source
      restricted-trace columns in original U after the physical normalizer and
      pooled moving root?
    next_action: >-
      Derive both {s_r,partial_p s_r}_{r=0,1,2} columns and score the existing
      rho-child/norm-4 covariance once.
    conditional_large_acquisition: >-
      Only if the images differ and exactly one indispensable coordinate is
      absent, acquire that coordinate with rank sectors, q/E, normalizer, root
      and slope sufficient statistics in one aligned batch block.
    stop_rule: >-
      Coincident profiled images certify non-identifiability; separated images
      use the frozen model-lowering rule without adding a post-reveal model.

  - id: cross_route_maximin_design
    class: immediate_portfolio_analysis
    issues: [275, 156, 159, 11, 31, 112, 227]
    acquisition: existing_data_and_power_receipts
    launchability: runnable_without_production
    information_gain: very_high
    compute_cost: low
    next_action: >-
      Compute common maximin prediction separation per CPU-hour for every route;
      routes without prospective opposing predictions receive zero launch score.
    stop_rule: publish_rank_and_freeze_one_launch_candidate_no_parameter_tuning_on_target_data

  - id: generic_modulus_vector_transport
    class: conditional_large_operator_discriminator
    issues: [156, 159, 275]
    acquisition: exact_design_then_small_pilot_then_conditional_new_production
    launchability: needs_exact_stabilizer_census_prediction_vectors_and_power
    information_gain: very_high
    compute_cost: high_if_promoted
    geometry: generic_period_pair_with_trivial_unit_stabilizer
    observer: complete_continuum_subtracted_homology_probability_vector
    required_directions: two_signed_physical_modulus_tangents
    prospective_models:
      - universal_weight4_modular_transport
      - conjugate_weight8_modular_transport
      - embedding_even_or_quotient_only_response
    next_action: >-
      Select equal-cost well-conditioned HNF representatives and certify the
      absence of accidental unit aliases before a covariance pilot.
    stop_rule: >-
      Do not promote if the profiled vector predictions are rank-degenerate or
      the pilot cannot resolve their maximin contrast at the declared budget.

  - id: pell_eisenstein_vector_jet
    class: conditional_large_structured_control
    issues: [156, 159]
    source_queue_id: pell_hexagonal_character
    proposed_large_sizes: [418, 780]
    first_population: square_bond_control
    later_population: square_site_matching_full_curve
    acquisition: exact_vector_contract_then_smaller_power_pilot_then_conditional_new_production
    launchability: needs_vector_jet_and_power_gate
    information_gain: high
    compute_cost: high_if_promoted
    correction_to_pr546: >-
      Replace a scalar typed-C3/H4 vote by the complete C3 homology-vector
      Taylor jet at the actual Pell modulus, with both signed Pell sides and
      continuum subtraction.
    stop_rule: >-
      Do not run N418/N780 or promote square site if the square-bond control
      fails the frozen vector organization or has inadequate power.

  - id: transfer_matrix_reproduction_frontier
    class: long_horizon_exact_numerical
    issues: [11, 31]
    source_queue_id: transfer_matrix_frontier
    acquisition: implementation_reproduction_and_profile
    launchability: subfrontier_only
    information_gain: medium_until_topological_observer_is_retained
    compute_cost: high_memory_at_frontier
    next_action: >-
      Implement weighted topological transfer, reproduce through width 24 and
      profile width 25 with measured state count, RSS, transition and restart.
    stop_rule: no_frontier_memory_purchase_from_extrapolation_alone

  - id: rigorous_block_event_certificate
    class: long_horizon_rigorous
    issues: [112]
    source_queue_id: rigorous_block_event_confidence
    acquisition: power_geometry_then_fresh_final_iid
    launchability: needs_scientific_geometry_and_power
    information_gain: medium
    compute_cost: high_if_promoted
    stop_rule: >-
      Park if no realizable cell geometry is expected to enter the
      preregistered high-power region or if the resulting bound does not change
      a named threshold/universality statement.

  - id: symmetry_matched_boolean_spectral_transmission
    class: medium_exploratory_pilot
    issues: [227]
    source_queue_id: boolean_spectral_sample_pilot
    acquisition: exact_irrep_contract_then_small_pilot
    launchability: needs_within_irrep_curve_prediction
    information_gain: medium
    compute_cost: moderate
    first_size: 65
    conditional_sizes: [130, 260]
    correction_to_pr546: >-
      Do not target the symmetry-forbidden orientation-difference by
      matching-odd levelwise zero. Compare within-irrep trajectories and score
      one covariance-aware curve contrast tied to local versus global support.
    stop_rule: >-
      No larger size if the frozen curve contrast is unstable, rank-degenerate
      or lacks a mechanism-lowering outcome.

stopped_or_not_queued:
  - id: gaussian_commuting_square
    issues: [158]
    proposed_sizes: [650, 850]
    reason: >-
      Power gate projects 27.21B and 55.18B samples; audited CRN gain is at most
      about 2.34 percent and direct/two-step paths are one target quotient.
    reopening_condition: orders_of_magnitude_estimator_or_exact_cost_reduction
  - id: p154_more_temporal_or_clock_scans
    issues: [154]
    reason: fresh_N85_5M_N340_160M_prospective_stop_rule_fired
  - id: p334_more_archive_descriptors
    issues: [334]
    reason: independent_N325_N425_interventions_complete_and_more_correlated_descriptors_do_not_supply_new_population_evidence
  - id: p537_topup_or_third_size
    issues: [537]
    reason: N65_20M_and_N145_200M_complete_remaining_gap_is_operator_definition_and_uniform_transport
  - id: gaussian_ideal_same_character_angle_scan
    issues: [275]
    reason: exact_unit_rotation_forces_the_primitive_character_into_omega_R_and_removes_spin_identification_gain

hardware:
  gpu_needed: false
  default_large_role: parallel_CPU_after_a_passed_decision_and_power_gate
  transfer_matrix_role: measured_high_memory_CPU_only_after_width24_reproduction
  execution_started_by_this_portfolio: false
