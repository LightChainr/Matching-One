version: 3
updated: 2026-08-29
purpose: >
  Lightweight navigation index for canonical documents, frozen predictions,
  immutable evidence and genuinely unintegrated frontier work. This registry
  never grants permission to run analysis and must not block integration.

integration_policy:
  registry_conflicts_block_science: false
  default_action: integrate_useful_asset_then_refresh_registry
  claim_strength_source: docs/STATUS.md
  execution_priority_source: docs/ROADMAP.md
  hard_constraints_source: GOVERNANCE.md

status_vocabulary:
  canonical_current: current mainline navigation or project-level claim document
  frozen_prediction: immutable pre-target hypothesis or scoring contract
  immutable_result: committed raw/derived evidence archive
  topic_derivation: focused mathematical or theoretical argument
  historical: retained provenance, not an active entrypoint
  frontier: distinct unintegrated work
  negative_result: retained failed hypothesis, method or underpowered campaign

canonical_documents:
  - {path: README.md, status: canonical_current, role: external_overview}
