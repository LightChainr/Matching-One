version: 2
updated: 2026-08-29
purpose: >
  Registry connecting canonical documents, frozen predictions, immutable evidence,
  topic derivations, historical protocols and currently unmerged frontier work.
  Integration status here is distinct from scientific claim level.

status_vocabulary:
  canonical_current: current mainline navigation or project-level claim document
  frozen_prediction: immutable pre-target hypothesis or scoring contract
  immutable_result: committed raw/derived evidence archive
  topic_derivation: focused mathematical or theoretical argument
  historical_snapshot: accurate record of an earlier project state
  superseded_protocol: retained protocol/queue no longer used as current execution entrypoint
  frontier_open: unmerged PR/branch; do not cite as canonical main evidence
  negative_result: retained failed hypothesis, method gate or underpowered campaign

