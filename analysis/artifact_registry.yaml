channel_semantics:
  implementation: scripts/wrapping_channels.py
  audit: predictions/wrapping_channel_audit_20260828.json
  primary_norm5_entrypoint: scripts/score_norm5_harmonic_primary_typed.py
  fullcurve_norm5_entrypoint: scripts/score_intrinsic_functional_cocycle_typed.py
  rule: >
    A scorer may compare channel-bearing values only when descriptors are identical
    or map_observable returns a registered exact transform. Size-local P4
    normalization is not a raw angular sign transported between sizes.
  required_fields:
    - topology_channel
    - combination
    - probability_coordinate
    - orientation_order
    - normalization
    - quantity

