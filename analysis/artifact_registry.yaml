channel_semantics:
  implementation: scripts/wrapping_channels.py
  audit: predictions/wrapping_channel_audit_20260828.json
  rule: >
    A scorer may compare channel-bearing values only when descriptors are
    identical or map_observable returns an exact registered transform.
  required_fields:
    - topology_channel
    - combination
    - probability_coordinate
    - orientation_order
    - normalization
    - quantity

