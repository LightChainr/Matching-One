integration_notes:
  - >
    PR #166 was merged before this registry was created so ROADMAP no longer
    carries the superseded physical sign-reversal interpretation.
  - >
    The type-safe channel semantics from PR #168 are incorporated into this
    organization branch because #168 diverged from main after the ROADMAP merge.
  - >
    Frontier PR entries are integration status only; scientific claim levels
    remain governed by docs/STATUS.md and chronology.

directory_contract:
  constants: exact/reference constants and relations
  data: literature datasets and provenance
  docs: canonical project-level navigation, status, and roadmap
  analysis: machine-readable research and artifact indexes
  notes: synthesis, theory, derivations, and bounded negative results
  scripts: analysis, scorers, exact checks, and research utilities
  experiments: frozen or historical experiment protocols and queues
  predictions: preregistered or frozen prediction artifacts
  results: immutable raw and derived research archives
  src: production C++ engines
  tests: scientific-contract, exact-regression, and smoke tests
