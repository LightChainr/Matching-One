schema: matching-one.etop-production-elimination.manifest.v1
status: post_reveal_existing_norm4_production_model_elimination

input:
  path: results/norm4-two-activation-h4/latest.json
  schema: matching-one.two-activation-h4.v1
  sha256: f29ce76fa5be92abb2a233c7efb6e4d94f37236242656d0dcf17cbfc3fd1e462
  artifact_commit: e5f39c1d14d54fb2097fd047585f532448918f7a
  artifact_state: hash_and_commit_pinned_open_pr_input
  source_manifest_sha256: 3c3a707a6001e44eb522fcd8b74cfae4e26c7cab1d2c02b70565bafe44dae59a
  required_sizes: [65, 85, 130, 170, 260, 340]
  required_metrics: [angular_delta_F1, angular_delta_F2, angular_delta_M]

exact_transform:
  source_basis: [angular_delta_F1, angular_delta_F2]
  output_basis: [A_top, E_top, F1, F2]
  rows:
    A_top: [1, 1]
    E_top: [-1, 1]
    F1: [1, 0]
    F2: [0, 1]
  definitions:
    A_top: delta_F1 + delta_F2
    E_top: delta_F2 - delta_F1
  semantic_boundary:
    all_coordinates: exact_Delta_cos4_normalized_direction_contrasts_at_the_pooled_matching_root
    F1_F2: activation_resolved_directional_responses_not_claims_about_whether_K1_or_K2_exists
    E_top: state_even_directional_H4_response_not_the_external_Euler_residue
  identity_tolerance:
    estimate_absolute: 1.0e-18
    covariance_absolute: 1.0e-20

models:
  - id: M0_PURE_ALEXANDER_ODD
    equation: E_top(N) = 0 for every declared P154 size
    nuisance_parameters: 0
    scope: excludes_only_a_pure_Alexander_odd_state_response_on_the_six_declared_P154_archives
  - id: M1_SECOND_ACTIVATION_DIRECTIONAL_RESPONSE_ZERO
    equation: angular_delta_F2(N) = 0 for every declared P154 size
    nuisance_parameters: 0
    scope: excludes_only_a_zero_second_activation_directional_H4_response_on_the_six_P154_archives_not_the_existence_of_K2
  - id: M2_FIRST_ACTIVATION_DIRECTIONAL_RESPONSE_ZERO
    equation: angular_delta_F1(N) = 0 for every declared P154 size
    nuisance_parameters: 0
    scope: excludes_only_a_zero_first_activation_directional_H4_response_on_the_six_P154_archives_not_the_existence_of_K1
  - id: M3_COMMON_PROJECTIVE_RANK_PLANE_LINE
    equation: E_top(N) = lambda * A_top(N) for every declared P154 size
    nuisance_parameters: 1
    parameter: lambda
    support: [-5.0, 5.0]
    grid_points: 4001
    refinement_tolerance: 1.0e-12
    scope: excludes_only_one_common_A_E_projective_line_across_the_six_declared_P154_sizes
  - id: M4_SINGLE_FIXED_H4_POWER
    equation: E_top(N) = c * N^(-13/8)
    nuisance_parameters: 1
    parameter: c
    support: [-10.0, 10.0]
    exponent: {numerator: 13, denominator: 8}
    scope: excludes_only_one_amplitude_fixed_13_over_8_E_top_law_without_corrections_on_P154

numerics:
  eigen_relative_cutoff: 1.0e-10
  eigen_absolute_floor: 1.0e-30
  decision_alpha: 0.05
  strong_reference_alpha: 1.0e-12
  p_value_calibration: asymptotic_chi_square_after_declared_covariance_rank_cut
  covariance: full_aligned_delete_one_matrix_from_the_pinned_norm4_input

outputs:
  schema: matching-one.etop-production-elimination.v1
  json: results/norm4-etop-production-elimination/latest.json
  markdown: results/norm4-etop-production-elimination/latest.md

phase_e_identifiability_boundary:
  status: not_identifiable_from_canonical_A_top_E_top_alone
  available_observers:
    - canonical_A_top_directional_response
    - canonical_E_top_directional_response
  missing_observer: >-
    A separately measured unrelated ordinary-even bulk singlet response on the
    same aligned P154 batches, with its joint covariance against A_top and E_top.
  missing_model_images: >-
    Explicit common-covariance J_top and J_bulk images: the first must bind the
    Jordan generalized partner to canonical E_top, while the second must bind
    it to the separately observed unrelated even singlet.
  guard: common_line_and_fixed_H4_power_scores_are_not_Phase_E_substitutes

claim_boundary:
  exact:
    - integer_linear_A_E_F1_F2_transform
    - input_content_hash_binding
    - dependency_group_and_full_covariance_reuse
  statistical:
    - jackknife_covariance
    - asymptotic_chi_square_calibration
  not_claimed:
    - exact_probability_bound
    - interval_reconstructed_LDL_certificate
    - SOS_infeasibility_certificate
    - Phase_E_J_top_versus_J_bulk_comparison
    - unrelated_even_bulk_singlet_measurement
    - exclusion_of_every_H4_or_multi_field_mechanism
    - continuum_operator_identification
