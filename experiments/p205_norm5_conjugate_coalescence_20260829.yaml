version: 1
created: 2026-08-29
status: pilot_ready_frozen_before_C_reveal
issue: 205
prediction: predictions/norm5_conjugate_coalescence_20260829.yaml
executable: build/threshold_rank_integer_period_mc
purpose: >-
  Run the smallest clean same-parent conjugation/quotient control before
  spending the much larger frozen norm-4 production budget. The 10M stage is
  itself a fixed-sample prospective score; if it is underpowered, later sample
  allocation may use its covariance but must not change the frozen residuals.

pilot:
  samples_per_pair: 10000000
  batches: 100
  threads_per_job: 8
  p_ref: 0.59274605079
  launch: two_pair_jobs_in_parallel_per_size_on_16_vcpu
  why_skip_1m: >-
    Fixed-p scoring does not need an intrinsic-center solve, and recent norm-4
    work showed that 1M blocks can be operationally marginal for stable
    delete-one curve diagnostics. Go directly to a still-cheap 10M covariance
    and signal check instead of adding a ceremonial stage.
  report_point_estimate: true
  no_model_refit_after_pilot: true

N325:
  C_representation: [15, 10]
  C_matrix: [[15, -10], [10, 15]]
  smith_C: [5, 65]
  pairs:
    - id: N325_C_vs_A
      first_representation: [15, 10]
      second_representation: [17, 6]
      first_matrix: [[15, -10], [10, 15]]
      second_matrix: [[17, -6], [6, 17]]
      seed: 2026105501
      replica_counter: [9300000000, 9310000000]
      output_prefix: results/server-20260829/P205-norm5-conjugate-coalescence/raw/n325_C_A_10m
      command: >-
        build/threshold_rank_integer_period_mc --first-matrix 15 -10 10 15
        --second-matrix 17 -6 6 17 --first-rep 15 10 --second-rep 17 6
