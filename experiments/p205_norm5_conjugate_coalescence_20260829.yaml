pre_score_checks:
  - all_period_determinants_equal_declared_N
  - C_smith_invariants_are_5_by_parent_N
  - duplicated_C_first_orientation_threshold_histograms_match_exactly_per_size
  - duplicated_C_first_orientation_moments_match_exactly_per_size
  - A_B_C_observable_descriptors_are_identical

score_order:
  - joint_H4_fixed_p_ref_affine_residual
  - fixed_H12_affine_residual
  - fixed_H8_affine_residual
  - full_curve_and_derivative_views_as_correlated_diagnostics

priority_rule: >-
  This control outranks starting the 260k-CPU-second norm-4 production when the
  same compute queue is scarce, because it tests the quotient/conjugation
  assumption on which a clean interpretation of norm-4 failure depends. It
  does not block norm-4 work that is already running or independently funded.
