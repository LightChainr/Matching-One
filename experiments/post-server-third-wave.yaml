status: frozen_confirmation_queue
principles:
  - preserve the completed server outputs unchanged
  - use independent seeds and counter ranges for confirmation
  - do not select sizes by observed significance
  - treat either/cross matching differences as duplicate topology views, not independent evidence
  - retain batch aggregates and sufficient statistics
  - separate Monte Carlo, arithmetic, and finite-size-model uncertainty

