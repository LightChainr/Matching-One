          reps: [[14,3],[13,6]]
        - N: 425
          reps: [[19,8],[16,13]]
      multi_angle_if_discovery_passes:
        N: 1105
        reps: [[33,4],[32,9],[31,12],[24,23]]
    coupling:
      representation: cyclic_Z_mod_N
      vertex_label: 'j = a*x + b*y mod N'
      default: same_U_j
      optional_relabel: 'j -> t*j mod N, gcd(t,N)=1'
      selection: >-
        Choose a bounded shortlist using graph-only step overlap or an
        independent pilot. Freeze t before evaluation and retain the entire
        pilot shortlist/results.
    observables_required:
      primal:
        - cross
        - both
        - either
        - direction_0
        - direction_1
      matching:
        - cross
        - both
        - either
        - direction_0
        - direction_1
      derived:
        - M_primal_minus_matching
        - covariance_across_orientations
    sample_plan:
      pilot_per_pair: 200000
      evaluation_N65: 2000000
      evaluation_N85: 2000000
      N145_and_later: power_from_previous_effect_and_covariance
    controls:
      - square_bond_exact_pc_half_with_same_geometry_engine
    outputs:
      - long_form_channel_means.csv
      - covariance_matrices.json
      - coupling_pilot.json
      - effect_power_budget.json
    stop_gate: >-
      If neither N=65 nor N=85 resolves a reproducible orientation effect in
      the larger single/matching-even sector and the exact control also shows
      no angular signal, stop before increasing N and debug/reassess geometry.

  - id: C02
    priority: P0
    status: derive_from_C01
    title: Matching-parity x rotation-parity sector decomposition
    issue: 24
    depends_on: [C01]
    purpose: >-
      Test whether the leading orientation-sensitive correction is
      matching-even and therefore projected out of the exact matching
      difference.
    derived_channels:
      S: '(R_G + R_hat)/2'
      D: '(R_G - R_hat)/2'
      delta_S: 'S(theta1)-S(theta2)'
      delta_D: 'D(theta1)-D(theta2)'
    angular_model:
      leading: 'A0 + A4*cos(4 theta)'
      optional_only_after_holdout: 'A8*cos(8 theta)'
    working_hypothesis:
      - 'S4 scales approximately as L^-2 in the discovery regime'
      - 'abs(D4/S4) decreases with L or D4 is strongly suppressed'
    outputs:
      - sector_effects.csv
      - angular_fit_training.json
      - heldout_orientation_predictions.json
      - deltaD_over_deltaS_vs_size.csv
    acceptance:
      - cos4 sign pattern at >=3 same-N sizes or a multi-angle same-N test
      - held-out orientation prediction succeeds
      - exact control validates angular implementation
      - a null D alone never counts as support

