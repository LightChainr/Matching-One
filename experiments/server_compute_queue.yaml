version: 1
updated: 2026-08-28
coordination_issue: 23
source_branch: research/second-wave-20260828
principles:
  - maximize information gain before raw scale
  - freeze pilot-selected choices before evaluation
  - preserve negative results and power analyses
  - retain sufficient statistics so analysis can be rerun without recomputation
  - do not use expensive GPU/high-memory hardware before a CPU gate justifies it
  - keep arithmetic, sampling, and finite-size-model uncertainty separate

handoff_contract:
  result_root: results/server-YYYYMMDD/<queue_id>/
  required_files:
    - metadata.json
    - REPORT.md
    - commands.txt
    - environment.txt
    - checksums.sha256
  metadata_required:
    - source_commit
    - source_branch
    - machine
    - os_kernel
    - compiler_or_interpreter
    - dependency_versions
    - rng_algorithm_if_stochastic
    - rng_seed_or_counter_ranges
    - sample_counts
    - wall_time
    - thread_or_gpu_configuration
  statistical_rules:
    - pilot data must not be reused as final evaluation data when pilot selects weights/couplings/models
    - report signed effects and covariance/correlation, not only absolute error or p-values
    - every null result should include a sensitivity or power statement when feasible
    - held-out targets/orientations/sizes remain hidden until all selectable choices are frozen
    - batchwise aggregates must be retained for bootstrap/jackknife when raw replicas are not retained

queue:
  - id: C00
    priority: P0
    status: ready
    title: General 2x2 integer-period torus and homology engine
    issue: 22
    depends_on: []
    purpose: >-
      Generalize the PR #21 homology implementation from axis/diamond scalar
      periods to an arbitrary integer 2x2 period matrix, so all later Gaussian,
      sheared and modular tori share one correctness path.
    requirements:
      - period matrix P with nonzero integer determinant
      - exact winding coefficients via adjugate(P)/det(P), never floating inversion
      - rank-0/rank-1/rank-2 winding subgroup tracking
      - generator-relative directional channels
      - invariance under unimodular period-basis changes
      - axis and diamond results exactly reproduce existing regressions
    tests:
      - exhaustive axis L=3
      - exhaustive diamond L=2
      - at least one small non-axis Gaussian quotient
      - random basis-change regression with determinant +/-1 transformations
    outputs:
      - reusable general topology module
      - exact regression JSON
      - state/edge convention documentation
    stop_gate: >-
      Do not start C01 production data until all exhaustive and basis-invariance
      tests pass.

