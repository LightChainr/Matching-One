version: 1
created: 2026-08-29
status: bounded_exact_oracle_and_local_pilot_complete
issues: [100, 121]
purpose: >-
  Add a local landing-sector mark to a fixed-root pivotal event. The mark is
  not reconstructible from threshold ranks; the unmarked pivotal total is kept
  only as a Russo regression control.

observable:
  event: cross wrapping
  root: fixed quotient vertex corresponding to (0,0)
  primal_term: root pivotal for primal cross at p
  matching_term: root pivotal for matching cross in the complemented field at 1-p
  annulus: Chebyshev, root removed
  landing_sectors: eight 45-degree sectors
  mark: axis_landing_indicator minus diagonal_landing_indicator
  primary:
    mu4: N times mean signed marked pivotal count
    a4: signed marked pivotal count divided by landed pivotal count
  control:
    mu0: N times mean unmarked pivotal count
    role: Russo identity regression, not independent evidence

exact_oracle:
  geometry: axis L=4
  N: 16
  radius: 1
  p: 1/2
  configurations: 32768
  controls:
    - fixed-root mass times N equals all-site exact pivotal mass
    - C4 rotation invariance
    - reflection invariance
    - pi-over-4 landing-registry shift negates H4
  interpretation: schema_and_symmetry_oracle_not_physical_scaling_point

pilot:
  N: 65
  representations:
    first: [8, 1]
    second: [7, 4]
  shared_counter_fields: true
  p: '0.592746050790'
  radius: 3
  samples: 200000
  batches: 100
  seed: 2026106201
  replica_counter_interval: [12000000000, 12000200000]
  role: engineering_acceptance_variance_and_paired_orientation_readout

forbidden:
  - call_mu0_a_new_observable
  - fit_a_scaling_exponent_from_one_size
  - tune_radius_or_landing_sectors_after_reading_the_pilot
  - treat_mu4_a4_mu0_or_the_two_orientations_as_independent
  - discard_pivotal_events_that_do_not_satisfy_the_frozen_landing_pattern
