chronology:
  N290_fullcurve_target_seen_before_this_freeze: false
  fixed_coordinate_N290_known: true
  note: >-
    The earlier 500M fixed-p N290 result is known and remains prospective for
    its own statistic. This full-curve plan freezes sample count, random domains,
    geometry and primary score order before threshold-rank N290 curves are opened.
