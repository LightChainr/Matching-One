  commit: 1b988f99b9431a3d109a74a45499b8c158a64079
  build: clang++ -O3 -std=c++17 -Wall -Wextra src/gaussian_orientation_mc.cpp -o build/gaussian_orientation_mc
  binary_sha256: 639b234d0215a4e66fec9ed7e83d3b933d677547906ad60aa43ff9dcf118739c
  joint_gram: sum first[i]*second[j] over the same Bernoulli replica

acquisition:
