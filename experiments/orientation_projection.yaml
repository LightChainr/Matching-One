version: 1
experiment: orientation-matching-projection
status: preregistration-draft
purpose: >-
  Test whether square-lattice orientation and primal/matching exchange act as
  approximate projectors on distinct finite-size correction sectors. Calibrate
  on exactly solved models before using the construction to sharpen square-site
  estimates.

literature_baseline:
  mertens_ziff_2016:
    doi: 10.1103/PhysRevE.94.062152
    facts:
      - finite torus matching identity is already known and exact
      - root M_L=0 converges empirically near L^-4
      - scaled two-size condition was observed near L^-7
  feng_deng_blote_2008:
    doi: 10.1103/PhysRevE.78.031136
    facts:
      - second thermal dimension X_t2=4
      - L^-2 and possible L^-2 log L corrections
      - square-lattice power correction amplitude depends on cylinder orientation

models:
  - id: square_bond_control
    lattice: square
    percolation: bond
    pc: "1/2"
    exact_pc: true
    purpose: positive control for orientation-sensitive square corrections

  - id: triangular_site_control
    lattice: triangular
    percolation: site
    pc: "1/2"
    exact_pc: true
    purpose: high-rotational-symmetry control

  - id: square_site_target
    lattice: square
    percolation: site
    exact_pc: false
    purpose: target problem

  - id: square_matching_target
    lattice: square_NN_plus_NNN
    percolation: site
    exact_pc: false
    relation: "pc(square_site) + pc(square_matching_target) = 1"

geometries:
  - id: axis
    description: square torus/cylinder aligned with lattice axes
    angle_rad: 0
    physical_length_rule: record explicitly in every data file

  - id: diagonal
    description: square torus/cylinder with finite direction along a lattice diagonal
    angle_rad: "pi/4"
    physical_length_rule: record sqrt(2) conversion explicitly

  - id: sheared_optional
    description: integer-period sheared tori for angular/modular tomography
    preregister_before_large_run: true

observables:
  - id: matching_function
    formula: "M_L(p) = N_L(p) - Nhat_L(1-p) - L^2 chi(p)"
    chi_square_site: "p - 2 p^2 + p^4"
    preferred_wrapping_equivalent: either_wrapping_difference

  - id: scaled_matching_function
    formula: "S_L(p) = L_phys^(13/4) M_L(p)"
    note: exponent 13/4 is the Mertens-Ziff hypothesis corresponding to L^-4 root bias

  - id: wrapping_probability
    use: Monte Carlo control and amplitude fits

primary_hypotheses:
  H_orientation_odd:
    statement: >-
      After physical-length normalization, a substantial component of the
      leading square-lattice correction changes sign between axis and diagonal
      geometries, consistent with a spin-4 contribution.
    reject_if: >-
      The exact square-bond control has no stable sign-changing amplitude under
      increasing size windows, or the projected estimator is not predictively
      better on held-out sizes.

  H_matching_x_orientation:
    statement: >-
      Matching exchange and pi/4 rotation separate different correction sectors;
      a four-channel amplitude table approximately decomposes into matching
      parity and rotation parity.
    reject_if: >-
      Amplitude signs/ratios drift without stabilization or cannot be reproduced
      between exact small systems and Monte Carlo.

  H_second_annihilator:
    statement: >-
      The residual after the known Mertens-Ziff two-size accelerated condition
      admits at least one stable preregistered power/log correction that can be
      annihilated by a three- or four-size filter.
    reject_if: >-
      Improvement disappears on withheld sizes, requires retuning weights, or
      produces unacceptable noise amplification.

analysis_order:
  - validate topology/wrapping code exhaustively on tiny systems
  - reproduce exact square-bond pc=1/2 in both orientations
  - fit orientation amplitudes without using square-site target digits
  - freeze projection convention and physical-length normalization
  - reproduce known Mertens-Ziff two-size acceleration
  - estimate candidate residual exponent family using training sizes only
  - freeze correction_filter.py weights
  - score on withheld sizes
  - only then apply the same pipeline to square-site target

reported_quantities:
  - raw sample counts and RNG seed/counter specification
  - geometry period vectors and physical lengths
  - covariance matrix between primal/matching/orientation channels
  - fitted amplitude with sign and uncertainty
  - held-out root prediction error
  - correction-filter weights and L1/L2 norms
  - separate sampling, arithmetic, and finite-size-model uncertainty

cpu_stage:
  hardware: "8 cores / 16 GB"
  goals:
    - exact tiny-size property tests
    - moderate-L reference Monte Carlo
    - square-bond orientation calibration
    - correction-filter and amplitude diagnostics
  gate_to_gpu: >-
    Do not rent GPU until orientation sign structure and primal/matching
    covariance are reproducible on CPU.

gpu_stage:
  hardware: "RTX 5090-class or comparable"
  suitable_work:
    - many independent replicas
    - bit-packed occupancy and wrapping tests
    - common-random-number primal/matching pairs
    - simultaneous axis/diagonal/aspect/shear campaigns
  unsuitable_first_work:
    - irregular high-frontier transfer-matrix hash/state enumeration

anti_overfit_rules:
  - never select a correction exponent using the largest test sizes
  - never change geometry weights after revealing target held-out sizes
  - benchmark every acceleration on an exactly solved control
  - publish failures and unstable amplitude fits
  - do not translate a deterministic fit residual into a confidence interval
