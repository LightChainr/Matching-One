changes:
  - id: C02
    status: operator_hypothesis_sharpened
    exact_algebra_result: >-
      At c=0,h=5/8 the level-2 null state is L_-2-(2/3)L_-1^2.
      After quotienting its null submodule, a unique non-null level-4
      quasiprimary direction remains. One representative is
      Q4=40 L_-2^2-60 L_-3 L_-1-9 L_-4, with L1 Q4=0.
      The associated bulk descendants have x=21/4 and spin +/-4.
    interpretation: >-
      Algebra establishes existence, not coupling or matching parity. Test whether
      the measured matching-odd thermal-even spin-4 sector is controlled by this
      thermal-family descendant, allowing logarithmic mixing.
    required_models:
      - 'A*L^(-13/4)'
      - 'L^(-13/4)*(A+B*log(L))'
      - 'A*L^(-omega) with omega trained without held-out sizes'
      - 'multi-sector model including L^-2 only where parity permits'
    reference_files:
      - notes/thermal-level4-spin4-candidate.md
      - scripts/virasoro_level4_candidate.py

  - id: C05
    priority: P0
    status: highest_information_compute_task
    add_outputs:
      - P4_of_primal_curve
      - P4_of_matching_curve
      - P4_of_matching_even_curve
      - P4_of_matching_odd_curve
      - thermal_even_odd_projection_at_frozen_u_values
    frozen_u_rule: >-
      Choose a small set of u values on pilot/training sizes only, then freeze.
      Define p_minus,p_plus by direction-averaged Mbar(p_minus)=-u and
      Mbar(p_plus)=+u. Never tune u on held-out sizes to improve exponent fits.
    primary_test: 'P4[D]_thermal_even at center/near-center versus exponent 13/4 and log alternative'
    secondary_test: 'search for allowed L^-2 spin-4 sector without assuming matching-even dominance'

