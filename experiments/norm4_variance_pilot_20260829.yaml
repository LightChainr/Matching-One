version: 1
created: 2026-08-29
status: pilot_only_before_large_norm4_production
issue: 154
purpose: >-
  Measure the full-curve variance and CPU cost of the noncyclic N260/N340
  dyadic children before deciding whether a 0.5B, 1B, or 2B norm-4 closure
  run has better information value than extending existing norm-5 blocks.

sampling:
  samples_per_size: 1000000
  batches: 100
  threads_per_job: 8
  launch: concurrent_8_plus_8_on_16_vcpu
  cross_size_rng: independent
  target_reveal_status: variance_pilot_not_prospective_model_score

N260:
  genealogy: 65_to_130_to_260
  first_representation: [16, 2]
  second_representation: [14, 8]
  quotient_smith_invariants: [2, 130]
  seed: 2026105401
  replica_counter_first: 8100000000
  replica_counter_last_exclusive: 8101000000
  command: >-
    build/threshold_rank_integer_period_mc --n 260 --samples 1000000
    --batches 100 --seed 2026105401 --replica-offset 8100000000
    --threads 8 --git-commit FULL_SHA
    --output-prefix results/server-20260829/P154-norm4-variance-pilot/raw/n260_1m

N340:
  genealogy: 85_to_170_to_340
  first_representation: [18, 4]
  second_representation: [14, 12]
  quotient_smith_invariants: [2, 170]
  seed: 2026105402
  replica_counter_first: 8100000000
  replica_counter_last_exclusive: 8101000000
  command: >-
    build/threshold_rank_integer_period_mc --n 340 --samples 1000000
    --batches 100 --seed 2026105402 --replica-offset 8100000000
    --threads 8 --git-commit FULL_SHA
    --output-prefix results/server-20260829/P154-norm4-variance-pilot/raw/n340_1m

pilot_outputs:
  - intrinsic center and mean matching slope inside every delete-one replicate
  - P4_S, P4_D, P4_S_prime, P4_D_prime with full within-size covariance
  - U_N: N^(13/8) * P4_S_prime / mean_matching_slope
  - projected standard errors at 0.5B, 1B, and 2B under inverse-sample scaling
  - CPU seconds per million replicas
  - q2/Jordan completion-gap signal-to-noise forecasts for both lineages
  - secondary pure-D and root-character closure forecasts

decision_rule:
  promote_if: >-
    At least one declared production scale gives useful joint q2-versus-Jordan
    discrimination per CPU-hour, or the noncyclic arithmetic-class closure is
    explicitly retained as the scientific objective.
  do_not_do: >-
    Do not interpret pilot point estimates as prospective q2/Jordan evidence,
    and do not change the exact dyadic null residuals after seeing the pilot.

exact_future_nulls:
  q2: R_q2 = U_N - 3*U_2N + 2*U_4N
  jordan: R_J = U_4N - 2*U_2N + U_N
  root_character: DeltaRoot_4N / DeltaRoot_N = 1/16
  central_D: P4_D_4N / P4_D_N = 4^(-13/8)
