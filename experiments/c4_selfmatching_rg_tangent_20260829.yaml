version: 1
created: 2026-08-29
status: N170_scalar_orthogonal_holdout_scored
issue: 155
purpose: >-
  Measure the exact p=1/2 Bernoulli score responses of all five wrapping
  channels to the uniform and staggered microscopic odd tangents, then test
  whether any two wrapping readouts resolve a second RG direction.

exact_oracle:
  geometry: {a: 3, b: 1, N: 10}
  response_each_channel: {d_t: 15/8, d_lambda: 5/4}
  Fisher: [[40, 0], [0, 40]]

discovery:
  geometry: {a: 11, b: 3, N: 130}
  exploratory_samples: 100000
  seed: 2026105501
  counter_interval: [0, 100000]
  observed_only_to_set_question: >-
    All wrapping response rows were nearly parallel; no model exponent or
    response pair was selected from this block.

frozen_confirmation:
  geometry: {a: 11, b: 3, N: 130}
  samples: 10000000
  batches: 100
  seed: 2026105501
  counter_interval: [1000000000, 1010000000]
  pair_gate:
    maximum_condition_number: 50
    minimum_absolute_determinant_z: 3
  decision: >-
    If no wrapping pair passes both gates, classify the wrapping response
    family as rank-1 at this precision. Do not extract or regularize a second
    generalized eigenvalue; design a local/sublattice odd readout instead.

future_N170:
  geometry: {a: 13, b: 1, N: 170}
  status: promoted_as_scalar_orthogonal_holdout_after_matrix_rank_failure
  samples: 10000000
  batches: 100
  seed: 2026105501
  counter_interval: [1000000000, 1010000000]
  primary_channel: cross
  source_rule: c_130 = d_lambda_R_cross(130) / d_t_R_cross(130)
  primary_residual: d_lambda_R_cross(170) - c_130*d_t_R_cross(170)
  source_uncertainty: recompute_c_130_inside_each_aligned_delete_one
  thermal_control:
    law: d_t R_cross scales as N^(3/8)
    fixed_ratio: (170/130)^(3/8)
  observed_result:
    source_c_130: 0.6740950243296661
    target_c_170: 0.6740655896003787
    orthogonal_residual_z: -0.0244453462
    thermal_scaling_residual_z: -0.2847192474
    conclusion: no_separate_odd_direction_resolved_in_cross_wrapping_projection

orientation_H4_rescue:
  frozen_after: N130_same_geometry_wrapping_rank_gate_failed
  first_representation: [11, 3]
  second_representation: [9, 7]
  shared_rng:
    seed: 2026105501
    counter_interval: [1000000000, 1010000000]
  primary_channel: cross
  response_rows:
    - orientation_mean
    - N_times_orientation_difference_over_DeltaCos4
  columns: [t, lambda]
  scale_invariant_conditioning: normalize_each_response_row_to_unit_Euclidean_norm
  pair_gate:
    maximum_row_angular_condition_number: 50
    minimum_absolute_determinant_z: 3
  N170_replication_if_pass:
    first_representation: [13, 1]
    second_representation: [11, 7]
  observed_result:
    cross_determinant_z: -0.098270749
    cross_row_angular_condition_number: 69.93566
    any_channel_passed: false

claim_boundary: >-
  Failure of the wrapping rank gate says that this topological readout family
  cannot resolve two odd RG directions. It does not prove the microscopic
  tangent plane itself is rank-1.
