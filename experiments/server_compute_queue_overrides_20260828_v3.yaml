root_amplitude_rule:
  correct_invariant: '-N^2 * DeltaRoot / DeltaCos4'
  not_primary: 'bare N^2 * DeltaRoot across different orientation pairs'
  reason: >-
    If DeltaM=A_M DeltaCos4 N^-13/8 and M_prime=B N^3/8, then the root amplitude
    tends to A_M/B only after division by DeltaCos4.
  rough_prediction_from_current_amplitudes: 'A_p ~ A_M/B ~ 0.451'
  next: use_higher_stat_threshold_rank_batches_to_score_angular_normalized_A_p

