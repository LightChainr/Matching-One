claim_boundary: >-
  Compatibility supports an integrated pivotal/four-arm interpretation. It
  does not identify a local landing-sector observable or prove an SLE/OPE
  coefficient relation.
observed:
  primary_Y_chi_square_df2: 10.3160883882
  matching_even_E_chi_square_df2: 0.4098636060
  Xi_chi_square_df2: 3.3069523125
  thermal_leading_law_chi_square_df2: 528.170319545
  decision: >-
    Dividing by total pivotal mass does not remove the known finite-size drift
    in P4[S_prime]. The dimensionless Xi coefficient remains compatible with a
