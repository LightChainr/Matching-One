version: 1
created: 2026-08-29
status: retrospective_bridge_scored
issues: [100, 121]
input:
  path: results/server-20260828/P33/p33_all_sizes_arm_10m.hist.csv
  sizes: [65, 85, 130, 145, 170]
  batches: 100
  evidence_class: retrospective_reuse
split:
  source_sizes: [65, 85, 130]
  heldout_sizes: [145, 170]
definitions:
  Mbar_prime: orientation mean of the matching-function derivative
  russo_interpretation: total primal-plus-matching pivotal mass
  normalized_pivotal_H4: J_N = P4[S_prime]/Mbar_prime
  primary_scaled: Y_N = N^(13/8)*J_N
  matching_even_pivotal_H4: E_N = N*P4[D_prime]/Mbar_prime
  coefficient_ratio: Xi_N = J_N/P4[D]
  thermal_control: T_N = N^(-3/8)*Mbar_prime
primary_score:
  model: constant Y_N
  fit_on: [65, 85, 130]
  score_on: [145, 170]
  covariance: synchronized delete-one pseudovalues across every size and metric
diagnostics:
  - constant E_N tests the relative L^(-2) anisotropy of total pivotal mass
  - constant Xi_N tests whether central D and pivotal H4 are coefficients of one scaling function
  - constant T_N checks the Russo mass exponent independently
evidence_rule: >-
  Y, Xi, and T are correlated deterministic views of one raw block. The Y
  heldout score is primary; Xi and T are mechanism diagnostics and must not be
  counted as independent confirmation.
high_statistics_archive:
  status: descriptive_protocol_frozen
  runs:
    65: results/server-20260828/P45-root-amplitude/n65.hist.csv
    85: results/server-20260828/P45-root-amplitude/n85.hist.csv
    130: results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.hist.csv
    170: results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.hist.csv
    185: results/server-20260828/P43-heldout-fullcurve-500m/raw/n185.hist.csv
    265: results/server-20260828/P43-heldout-fullcurve-500m/raw/n265.hist.csv
    325: results/server-20260829/P57-norm5-500m/raw/n325_500m.hist.csv
    425: results/server-20260829/P57-norm5-500m/raw/n425_500m.hist.csv
  covariance_blocks:
    - [65, 85, 130, 170]
    - [185]
    - [265]
    - [325]
    - [425]
  score_rule: >-
    Report constant-amplitude GLS diagnostics for the four frozen transforms.
    They are descriptive whole-archive tests, not heldout evidence and do not
    replace the five-size primary split.
  observed:
    matching_even_E_chi_square_df7: 8.7925829784
    Xi_chi_square_df7: 9.4581106356
    matching_odd_Y_chi_square_df7: 117.879577275
    decision: >-
      The relative L^(-2) anisotropy of total pivotal mass is stable across the
      eight-size archive, and Xi remains compatible with a common coefficient.
      The matching-odd normalized derivative decisively retains finite-size
