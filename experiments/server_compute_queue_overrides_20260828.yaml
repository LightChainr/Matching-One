version: 1
updated: 2026-08-28
supersedes_fields_in: experiments/server_compute_queue.yaml
coordination_issue: 23
reason: >-
  Latest server results and review expose two required corrections: the finite-size
  summary still loads decimal inputs before setting mpmath precision, and the
  wrapping-only matching differences are configuration-level identical rather
  than merely equal-mean control-variate channels. Same-N production also
  resolves a matching-odd cos(4 theta) signal, so C02 must no longer assume
  matching-even dominance.

overrides:
  - id: MERGE_BLOCKER_PRECISION
    priority: P0
    target_pr: 21
    status: required_before_merge
    problem: >-
      scripts/summarize_finite_size_grid.py currently calls load_observations()
      before mp.mp.dps is set to chosen_dps. mp.mpf conversion therefore occurs
      at the default precision and lost digits cannot be recovered later.
    required_change:
      - load grid payloads and determine chosen_dps first
      - set mp.mp.dps = chosen_dps
      - only then parse decimal CSV strings into mp.mpf
      - rerun summary and report from original decimal strings
      - preserve old output as superseded provenance if practical
    regression_test: >-
      Use a CSV value with more than 30 non-binary-friendly decimal digits and
      assert exact agreement with an mp.mpf constructed after setting high dps.
    scientific_note: >-
      The correction is about 2.7e-16 in the reported intercept and does not
      change the current scientific conclusion, but it is mandatory for a claim
      of high-precision input handling.

  - id: C00
    status: completed_on_PR21
    evidence: >-
      General nonsingular integer 2x2 period matrices, exact adjugate/determinant
      winding coordinates, Gaussian/circulant regressions and unimodular basis
      invariance are implemented and the combined suite passes.

  - id: C01
    status: discovery_passed
    evidence:
      - 'N=65 matching-function orientation difference: +1.00377e-3 +/- 1.68e-4'
      - 'N=85 matching-function orientation difference: +7.60333e-4 +/- 1.58e-4'
      - 'N=145 matching-function orientation difference: +3.28667e-4 +/- 1.95e-4'
      - 'N^(13/8) DeltaM / Delta cos4theta approximately 0.650, 0.651, 0.557'
    next:
      - independent production seed at N=65 and N=85
      - add at least one held-out same-N orientation pair
      - after C05, replace fixed-p-only analysis by full thermal-coordinate scan

  - id: C02
    status: hypothesis_revised
    old_hypothesis_rejected_as_gate: >-
      Do not require the matching-even sector S4 to dominate D4. The latest
      N=65,85,145 production does not show stable matching-even dominance,
      while the matching-function/matching-odd orientation signal is resolved
      at N=65 and N=85.
    primary_question: >-
      Determine matching parity, rotation harmonic, thermal parity and size
      exponent jointly, rather than assigning spin-4 to the matching-even sector
      in advance.
    angular_projectors:
      P4: '(X(theta1)-X(theta2))/(cos(4theta1)-cos(4theta2))'
      P0: '(cos(4theta1)*X(theta2)-cos(4theta2)*X(theta1))/(cos(4theta1)-cos(4theta2))'
    scaling_models_to_compare_blindly:
      - 'P4[M] ~ A*N^(-13/8)'
      - 'P4[M] ~ A*N^(-1)'
      - 'P4[M] ~ A*N^(-13/8)*(1+B*log(N))'
      - 'free exponent on training sizes, scored on held-out sizes/orientations'
    operator_candidate: >-
      A matching-odd spin-4 correction with x=21/4 is a high-value conjecture
      because L^(2-x)=L^(-13/4) and division by M_prime~L^(3/4) yields an
      L^-4 root shift. A possible CFT origin is a level-4 spin +/-4 descendant or
      quasiprimary in the thermal h=hbar=5/8 family. Treat this as conjectural;
      c=0 logarithmic/null-vector structure must be checked before identification.

  - id: C03
    status: redesign_required
    invalidate_old_channels: >-
      Do not run GLS over D_cross, D_both, D_either, D_direction_0 and
      D_direction_1 as if they were distinct equal-mean estimators. Exact tiny
      torus tests show these differences are configuration-level identical on
      the complementary periodic construction, hence wrapping-only covariance is
      rank one and no variance reduction is possible.
    new_title: Euler and motif control-variate hierarchy
    base_random_variable: 'q in {-1,0,+1}, the common wrapping-difference topology variable'
    canonical_controls:
      - 'Z_V = V - N*p'
      - 'Z_E = E - 2*N*p^2 for square NN edges'
      - 'Z_F = F0 - N*p^4 for occupied elementary square faces'
      - 'additional local motif counts with analytically known means'
    identity: >-
      D_N = q + Z_V - Z_E + Z_F for the square-site Euler/matching relation,
      subject to exact convention verification on the implemented quotient.
    microcanonical_centering:
      - 'E[E | K=k] = 2*N*(k)_2/(N)_2'
      - 'E[F0 | K=k] = N*(k)_4/(N)_4'
    method: >-
      Estimate coefficients on an independent pilot or by cross-fitting, freeze
      them, and evaluate q plus centered Euler/motif controls on fresh replicas.
    acceptance:
      - exact zero-mean/control identities on exhaustive tiny systems
      - variance reduction on fresh evaluation data
      - no ridge-induced pseudo-information from duplicate wrapping channels

  - id: C04
    status: partial
    completed:
      - square_bond_exact_and_MC_control
    result: >-
      A fixed L^-3/2 correction fit is compatible with the held-out L=16 point;
      an all-size statistical-only intercept near -1.649 +/- 0.023 retains but
      does not establish -5/3.
    still_required:
      - triangular-site self-matching exact-pc control
      - second microscopic realization before universality claim
      - higher statistics / threshold-rank estimator before sharp rational test

  - id: C05
    priority: P0
    status: immediate_next_core_task
    reason: >-
      Threshold-rank Newman-Ziff is now required not only for profile work but
      for a thermal-even/odd decomposition of the resolved angular signal.
    extra_required_outputs:
      - per-orientation K_minus and K_plus batch histograms
      - joint orientation coupling aggregates
      - reconstructable R_G(p), R_hat(p), S(p), D(p), and P4 of each
    thermal_projection_protocol: >-
      From the direction-averaged matching function Mbar_N(p), choose frozen u
      values and solve Mbar_N(p_minus)=-u, Mbar_N(p_plus)=+u. For X4=P4[X], form
      X4_even(u)=(X4(p_plus)+X4(p_minus))/2 and
      X4_odd(u)=(X4(p_plus)-X4(p_minus))/2. This defines a near-center reflection
      without requiring the final digits of pc.
    target_tests:
      - 'Does P4[D]_thermal_even at u=0 scale near L^-13/4?'
      - 'Does any P4[S]_thermal_even component scale near L^-2?'
      - 'Do logarithmic alternatives improve held-out prediction?'

  - id: C10
    status: promoted_to_control_after_C05
    add_same_N_magic_pair:
      N: 169
      reps: [[13,0],[12,5]]
      purpose: >-
        Same N compares an axis orientation with a rational approximation close
        to theta=pi/8 where a pure cos4theta amplitude vanishes. Use only after
        angular and thermal projectors are frozen; do not tune the zero on this
        held-out pair.

