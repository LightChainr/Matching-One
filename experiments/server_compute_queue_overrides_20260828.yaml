  - id: C02_radial_thermal_confirmation
    priority: P0
    title: Blind radial and thermal-parity test of the angular signal
    issue: 22
    depends_on: [C01_confirmation, C05_cpp]
    training_sizes: [65,85,130]
    heldout_sizes: [145,170]
    radial_models:
      - 'deltaM=A*deltaCos4*N^(-13/8)'
      - 'deltaM=deltaCos4*N^(-13/8)*(A+B*N^(-omega/2)); omega selected on training only from [1,2,3]'
      - 'deltaM=deltaCos4*N^(-13/8)*(A+B*log(N))'
      - 'deltaM=A*deltaCos4*N^(-alpha); alpha selected on training only'
    thermal_projection: >-
      From the orientation-averaged matching curve choose frozen levels u and
      solve Mbar(p_minus)=-u, Mbar(p_plus)=+u. For X4=P4[X], report
      X4_even=(X4(p_plus)+X4(p_minus))/2 and
      X4_odd=(X4(p_plus)-X4(p_minus))/2.
    tests:
      - central matching-odd amplitude persists after thermal reflection
      - orientation root gap is compatible with N^-2 on held-out sizes
      - logarithmic alternatives are scored out of sample
    acceptance: >-
      An exponent/operator claim requires held-out success; agreement of N=65
      and N=85 alone is insufficient.

