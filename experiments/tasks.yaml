version: 1
project: Matching-One
principle: "Prefer predictive finite-size structure over decimal numerology."

tasks:
  - id: T00
    priority: P0
    title: Build a provenance-complete threshold and finite-size dataset
    issue_title: "[P0] Reconcile published finite-size sequences and threshold claims"
    resources:
      cpu_cores: 1
      ram_gb: 2
      gpu: false
    inputs:
      - Jacobsen 2015 periodic-cylinder sequence n=1..21
      - Mertens 2022 p_med and p_cell sequences n=1..24
      - Yang-Zhou 2024 cylindrical and helical sequences n=1..24
      - Jacobsen 2024 Reply sequence/fit details
    outputs:
      - data/manifest.yaml
      - immutable decimal CSV files
      - references.bib
      - checksums and transcription tests
    acceptance:
      - every decimal has source table/equation and estimator definition
      - disputed threshold values are stored as estimates, never definitions

  - id: T01
    priority: P0
    title: Blind rolling-origin finite-size extrapolation audit
    issue_title: "[P0] Blind rolling-origin audit of all threshold estimators"
    resources:
      cpu_cores: 8
      ram_gb: 8
      gpu: false
    command: >-
      python scripts/finite_size_audit.py
      data/jacobsen_2015_square_site_cylinder.csv
      --models 4 4,6 4,6,8 4,6,8,10 4,6,8,10,12
      --min-train 8 --holdout 2 --dps 100 --json results/audit.json
    outputs:
      - rolling-origin prediction errors
      - intercept drift maps
      - model-averaged exploratory interval
    acceptance:
      - largest widths are withheld during model selection
      - arithmetic and extrapolation errors are reported separately
      - all model choices and exclusions are reproducible

  - id: T02
    priority: P0
    title: Predict widths 22-24 from widths <=21 before revealing them
    issue_title: "[P0] Pre-registered n=22..24 prediction challenge"
    resources:
      cpu_cores: 8
      ram_gb: 8
      gpu: false
    outputs:
      - signed predictions for p_pol(22), p_pol(23), p_pol(24)
      - frozen model weights and hashes
      - post-reveal scoring report
    acceptance:
      - predictions are committed before importing the 2024 values
      - scoring uses absolute error and log score across all three widths

  - id: T03
    priority: P0
    title: Implement exact finite-torus matching identities
    issue_title: "[P0] Exact finite-torus matching identity and exhaustive tests"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: false
    outputs:
      - simultaneous NN and NN+NNN connectivity engine
      - exhaustive small-L tests
      - cluster-count and wrapping-identity checks
    acceptance:
      - exact rational/polynomial equality on all exhaustively enumerable sizes
      - independent tests for horizontal, vertical, either, and both wrapping classes

  - id: T04
    priority: P1
    title: Search for a matching-symmetric superconvergent estimator
    issue_title: "[P1] Search for L^-4 and L^-6 cancellation in matched estimators"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: optional
    hypotheses:
      - matching changes the sign of the leading irrelevant amplitude
      - a frozen combination cancels both L^-4 and L^-6 terms
    outputs:
      - paired amplitude estimates
      - frozen estimator weights
      - withheld-size validation
    acceptance:
      - improvement is out-of-sample and persists over at least three size doublings

  - id: T05
    priority: P1
    title: Coupled Newman-Ziff Monte Carlo for G and its matching lattice
    issue_title: "[P1] Coupled NN/NN+NNN Newman-Ziff estimator with shared randomness"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: optional
    outputs:
      - covariance-reduced matching difference
      - variance comparison against independent replicas
      - finite-size root sequence
    acceptance:
      - exact small-size calibration
      - reproducible counter-based RNG
      - reported effective sample size and autocorrelation assumptions

  - id: T06
    priority: P1
    title: GPU bit-parallel wrapping-probability campaign
    issue_title: "[P1][GPU] Bit-parallel matched wrapping campaign near p_c"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: "RTX 5090-class or comparable; large batches, not required for validation"
    outputs:
      - narrow-grid wrapping curves for many L
      - matched covariance matrix
      - pre-registered finite-size fits
    acceptance:
      - CPU/GPU bitwise agreement on deterministic test vectors
      - no GPU campaign before T03 passes
      - raw aggregate counters and seeds are published

  - id: T07
    priority: P1
    title: Reproduce and extend cylindrical/helical transfer matrices
    issue_title: "[P1][RAM] Reproduce n<=24 and profile transfer-matrix extension"
    resources:
      cpu_cores: "8 for reproduction; 32+ desirable for frontier"
      ram_gb: "16 for prototypes; 256+ likely for frontier"
      gpu: "low priority; investigate only after matrix-free profiling"
    outputs:
      - exact/reproducible p_c(n) sequence
      - state-count and memory-growth model
      - checkpointed matrix-free eigensolver
    acceptance:
      - reproduce published widths and digits first
      - deterministic state encoding and transition hashes
      - resource estimate for n=25..28 before renting hardware

  - id: T08
    priority: P2
    title: Identify matching parity of irrelevant operators
    issue_title: "[P2] CFT explanation of 4,6,8 corrections and matching parity"
    resources:
      cpu_cores: 4
      ram_gb: 8
      gpu: false
    outputs:
      - operator-selection table by topology and boundary condition
      - predicted zero/sign relations among correction amplitudes
      - numerical tests linked to T04
    acceptance:
      - at least one new quantitative amplitude or exponent prediction

  - id: T09
    priority: P2
    title: Enumerate exactly solvable decorated approximants
    issue_title: "[P2] Automated self-dual gadget and critical-manifold search"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: optional
    outputs:
      - canonical library of terminal connectivity polynomials
      - self-dual candidate cells
      - convergence comparison with standard critical polynomials
    acceptance:
      - exhaustive coverage for a declared cell-size bound
      - every retained gadget predicts at least one independent observable

  - id: T10
    priority: P2
    title: Computer-assisted rigorous bound improvement
    issue_title: "[P2] Search replacement gadgets for improved rigorous bounds"
    resources:
      cpu_cores: 8
      ram_gb: "16 for prototypes; more for broad search"
      gpu: false
    outputs:
      - interval-certified connection probabilities
      - machine-checkable certificates
      - candidate upper/lower bound theorem
    acceptance:
      - no floating-point-only proof claims
      - independent verifier included

  - id: T11
    priority: P3
    title: Interval PSLQ and bounded-height exclusion
    issue_title: "[P3] Resume PSLQ only after threshold interval stabilizes"
    resources:
      cpu_cores: 8
      ram_gb: 16
      gpu: false
    depends_on: [T01, T02, T04]
    outputs:
      - degree/height-bounded algebraic exclusion
      - basis-defined mixed-constant searches
      - false-positive calibration
    acceptance:
      - input is an interval, not a rounded decimal
      - every exclusion states degree, height, basis, precision, and algorithm
