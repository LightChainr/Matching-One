name: Experiment or computation proposal
description: Propose a frozen, falsifiable numerical or exact-computation task
title: "[EXPERIMENT] "
body:
  - type: textarea
    id: question
    attributes:
      label: Research question and hypothesis
      description: State the primary hypothesis, estimand, sign/exponent/amplitude prediction, and why the test is discriminating.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Current evidence and literature boundary
      description: Separate known literature, repository results, deductions, and new conjecture. Link dependencies.
    validations:
      required: true
  - type: dropdown
    id: target_level
    attributes:
      label: Intended claim level
      options:
        - C1 validated method/control
        - C2 exploratory signal
        - C3 confirmed finite-size result
        - C4 asymptotic/mechanistic interpretation
        - C5 rigorous result/certificate
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Frozen design
      description: Sizes, geometries, orientation order, parameters, training/pilot/evaluation/held-out partitions, and stopping rule.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Competing models and controls
      description: Include exact positive/negative controls and the alternatives that can falsify the preferred explanation.
    validations:
      required: true
  - type: textarea
    id: rng
    attributes:
      label: RNG, coupling, and batching
      description: Algorithm, domain-separation keys, seed/counter policy, cross-size/geometry coupling, batches, and determinism tests. Write “not stochastic” for exact work.
    validations:
      required: true
  - type: textarea
    id: statistics
    attributes:
      label: Primary statistic and covariance plan
      description: Define the statistic, uncertainty/covariance estimator, conditioning diagnostics, and held-out scoring rule.
    validations:
      required: true
  - type: textarea
    id: power
    attributes:
      label: Power, sensitivity, or bounded search limit
      description: State pilot use, expected effect/variance, sample-count rule, or exact search bounds.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Required raw and derived outputs
      description: Sufficient statistics, metadata, hashes, commands, reports, tests, and archive path.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance, failure, and no-go criteria
      description: State what advances the hypothesis, what rejects it, and what counts only as underpowered or inconclusive.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Resource and dependency gate
      description: CPU/GPU/RAM estimate, measured baseline, prerequisite issues/PRs, and why the computation is worth its cost.
    validations:
      required: true
  - type: checkboxes
    id: commitments
    attributes:
      label: Commitments
      options:
        - label: I will freeze the primary design before evaluation.
          required: true
        - label: I will preserve null results, failed models, and provenance-limited outputs.
          required: true
        - label: I will not overwrite committed result artifacts.
          required: true
