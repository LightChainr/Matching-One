name: Bug or research-integrity defect
description: Report a reproducible software, data, covariance, provenance, or convention defect
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Do not publish credentials or a weaponized security exploit here. Use the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the defect and the affected result or workflow.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Affected commit, branch, PR, or result path
      placeholder: full SHA, PR number, and/or repository path
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest deterministic command, input, or configuration that demonstrates the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and provenance
      description: OS, interpreter/compiler, dependency versions, source/executable hashes, RNG domain, and dirty-tree state when relevant.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact class
      options:
        - Software behavior only
        - Exact/reference control
        - Numerical central value
        - Uncertainty or covariance
        - RNG independence or reproducibility
        - Data provenance or transcription
        - Scientific interpretation or claim level
        - Unknown
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Known affected scope
      description: Identify files, sizes, models, reports, claims, or downstream artifacts that may need correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, checksums, or minimal evidence
      description: Paste concise text or link repository artifacts. Do not upload secrets.
