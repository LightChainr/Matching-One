name: Theory or mechanism proposal
description: Propose a derivation, operator identification, exact structure, or rigorous route
title: "[THEORY] "
body:
  - type: textarea
    id: statement
    attributes:
      label: Precise statement
      description: State the proposed identity, mechanism, operator content, bound, or theorem with conventions and assumptions.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Literature and repository boundary
      description: What is already known, what follows from known results, and what is new here? Give citations or repository links.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current status
      options:
        - C0 conjecture or research direction
        - C1 exact algebra/control checked
        - C2 interpretation supported by exploratory data
        - Candidate C4 mechanism awaiting discriminating tests
        - Candidate C5 rigorous statement awaiting proof/certificate
    validations:
      required: true
  - type: textarea
    id: derivation
    attributes:
      label: Derivation or proof strategy
      description: Show the core reasoning, modules/symmetries/normalizations, and where assumptions enter.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Competing explanations and failure modes
      description: List lower-dimension sectors, logarithmic mixing, geometry artifacts, convention dependence, or counterexamples that must be excluded.
    validations:
      required: true
  - type: textarea
    id: prediction
    attributes:
      label: New falsifiable prediction
      description: Give at least one sign, zero, amplitude ratio, geometry relation, exponent, or certified bound not used to formulate the proposal.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Independent verification plan
      description: Separate derivation/checker, exact symbolic test, control model, or numerical held-out discriminator.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables and acceptance criteria
      description: Files, scripts, notes, certificates, tests, and the evidence required for claim-level advancement.
    validations:
      required: true
