name: Norm-5 rank-gap target score

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/norm5-rank-gap-score.yml

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Score frozen N325/N425 rank-gap targets
        run: |
          mkdir -p results/server-20260829/P57-norm5-500m/post-reveal-rank-gap
          python scripts/score_rank_gap_boundary_targets.py \
            --source-score results/server-20260828/rank-gap-thermal-window/score.json \
            --target-run 325:results/server-20260829/P57-norm5-500m/raw/n325_500m.moments.csv:results/server-20260829/P57-norm5-500m/raw/n325_500m.metadata.json \
            --target-run 425:results/server-20260829/P57-norm5-500m/raw/n425_500m.moments.csv:results/server-20260829/P57-norm5-500m/raw/n425_500m.metadata.json \
            --output results/server-20260829/P57-norm5-500m/post-reveal-rank-gap/score.json
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
          } > results/server-20260829/P57-norm5-500m/post-reveal-rank-gap/environment.txt
          sha256sum results/server-20260829/P57-norm5-500m/post-reveal-rank-gap/score.json \
            > results/server-20260829/P57-norm5-500m/post-reveal-rank-gap/checksums.sha256
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/server-20260829/P57-norm5-500m/post-reveal-rank-gap
          git commit -m "analysis: score norm5 rank-gap target [skip ci]"
          git push origin HEAD:main
