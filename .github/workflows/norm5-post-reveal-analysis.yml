name: Norm-5 post-reveal analysis bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/norm5-post-reveal-analysis.yml

permissions:
  contents: write

concurrency:
  group: norm5-post-reveal-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run norm-5 analysis bundle
        run: |
          rm -rf results/server-20260829/P57-norm5-500m/post-reveal-bundle
          python scripts/run_norm5_analysis_bundle.py \
            --run 65:results/server-20260828/P45-root-amplitude/n65.hist.csv:results/server-20260828/P45-root-amplitude/n65.moments.csv:results/server-20260828/P45-root-amplitude/n65.metadata.json \
            --run 85:results/server-20260828/P45-root-amplitude/n85.hist.csv:results/server-20260828/P45-root-amplitude/n85.moments.csv:results/server-20260828/P45-root-amplitude/n85.metadata.json \
            --run 130:results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.hist.csv:results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.moments.csv:results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.metadata.json \
            --run 170:results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.hist.csv:results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.moments.csv:results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.metadata.json \
            --run 325:results/server-20260829/P57-norm5-500m/raw/n325_500m.hist.csv:results/server-20260829/P57-norm5-500m/raw/n325_500m.moments.csv:results/server-20260829/P57-norm5-500m/raw/n325_500m.metadata.json \
            --run 425:results/server-20260829/P57-norm5-500m/raw/n425_500m.hist.csv:results/server-20260829/P57-norm5-500m/raw/n425_500m.moments.csv:results/server-20260829/P57-norm5-500m/raw/n425_500m.metadata.json \
            --output-dir results/server-20260829/P57-norm5-500m/post-reveal-bundle

      - name: Record exact command state
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            python -m pip freeze
          } > results/server-20260829/P57-norm5-500m/post-reveal-bundle/environment.txt
          find results/server-20260829/P57-norm5-500m/post-reveal-bundle -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > results/server-20260829/P57-norm5-500m/post-reveal-bundle/checksums.sha256

      - name: Commit derived bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/server-20260829/P57-norm5-500m/post-reveal-bundle
          if git diff --cached --quiet; then
            echo "Derived bundle is already current."
            exit 0
          fi
          git commit -m "analysis: score norm5 post-reveal bundle [skip ci]"
          git push origin HEAD:main
