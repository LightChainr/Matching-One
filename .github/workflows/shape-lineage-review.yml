name: Existing shape-lineage review
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/shape_lineage_review.py'
      - 'scripts/shape_lineage_nonlinear_jackknife.py'
      - 'tests/test_shape_lineage_review.py'
      - '.github/workflows/shape-lineage-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy mpmath
      - run: python -m unittest discover -s tests -p 'test_shape_lineage_review.py'
      - name: Read existing quantiles and covariance only
        run: python scripts/shape_lineage_review.py --compact
      - name: Check full nonlinear uncertainty on existing histograms
        run: python scripts/shape_lineage_nonlinear_jackknife.py
