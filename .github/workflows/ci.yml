name: ci

# CI catches computational breakage, not scientific truth.
# Run the complete suite once on 3.11; compile-check 3.9 and 3.13.
# The full suite includes the P598 NumPy/SciPy balanced-realization tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        shell: bash
        run: |
          targets=()
          for path in scripts tests; do
            [[ -e "$path" ]] && targets+=("$path")
          done
          (( ${#targets[@]} )) && python -m compileall -q "${targets[@]}"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run tests
        shell: bash
        run: |
          [[ -d tests ]] && python -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke check
        shell: bash
        run: |
          [[ -f scripts/compare_candidates.py ]] && python scripts/compare_candidates.py

  cxx:
    name: C++17 build and self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone C++ sources
        shell: bash
        run: |
          shopt -s nullglob
          sources=(src/*.cpp)
          if (( ${#sources[@]} == 0 )); then
            echo "No C++ sources on this branch."
            exit 0
          fi
          mkdir -p build/ci
          for source in "${sources[@]}"; do
            name="$(basename "${source%.cpp}")"
            binary="build/ci/$name"
            echo "Compiling $source"
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror=return-type \
              -fopenmp "$source" -o "$binary"
            if grep -q -- '--self-test' "$source"; then
              echo "Running $name --self-test"
              timeout 120 "$binary" --self-test
            fi
          done
