name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The scientific ledger pins branch-only commit:path evidence.  A
          # shallow PR checkout cannot validate those immutable provenance
          # pointers even when they are valid in the repository.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          targets=()
          for path in scripts tests; do
            if [[ -e "$path" ]]; then
              targets+=("$path")
            fi
          done
          if (( ${#targets[@]} )); then
            python -m compileall -q "${targets[@]}"
          fi

      - name: Validate structured control files
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          roots = [Path("constants"), Path("experiments"), Path("predictions")]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.json"):
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)

          try:
              import yaml
          except ModuleNotFoundError:
              yaml = None

          if yaml is not None:
              for root in roots:
                  if not root.exists():
                      continue
                  for pattern in ("*.yaml", "*.yml"):
                      for path in root.rglob(pattern):
                          with path.open(encoding="utf-8") as handle:
                              yaml.safe_load(handle)
          PY

      - name: Run unit and regression tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          fi

      - name: Run main-branch smoke check
        shell: bash
        run: |
          if [[ -f scripts/compare_candidates.py ]]; then
            python scripts/compare_candidates.py
          fi

  cxx:
    name: C++17 build and self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile standalone C++ sources
        shell: bash
        run: |
          shopt -s nullglob
          sources=(src/*.cpp)
          if (( ${#sources[@]} == 0 )); then
            echo "No C++ sources on this branch."
            exit 0
          fi

          mkdir -p build/ci
          for source in "${sources[@]}"; do
            name="$(basename "${source%.cpp}")"
            binary="build/ci/$name"
            echo "Compiling $source"
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror=return-type \
              -fopenmp "$source" -o "$binary"

            if grep -q -- '--self-test' "$source"; then
              echo "Running $name --self-test"
              timeout 120 "$binary" --self-test
            fi
          done
