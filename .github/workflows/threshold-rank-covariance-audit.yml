name: Threshold-rank covariance audit

on:
  push:
    branches:
      - research/threshold-rank-covariance-audit-20260828
      - agent/cov46-harden
    paths:
      - .github/workflows/threshold-rank-covariance-audit.yml
      - scripts/audit_threshold_rank_covariance.py
      - scripts/score_threshold_rank_root_doubling.py
      - scripts/validate_threshold_rank_covariance_archive.py
      - tests/test_threshold_rank_cross_size_covariance.py
      - tests/test_threshold_rank_root_doubling.py
      - tests/test_threshold_rank_covariance_archive.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threshold-rank-covariance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run covariance regression tests
        run: >-
          python -m unittest
          tests.test_threshold_rank_cross_size_covariance
          tests.test_threshold_rank_root_doubling
          tests.test_threshold_rank_covariance_archive
          -v

      - name: Reconstruct hardened cross-size covariance into COV46
        run: |
          mkdir -p results/server-20260828/COV46
          python scripts/audit_threshold_rank_covariance.py \
            --histograms results/server-20260828/P33/p33_all_sizes_arm_10m.hist.csv \
            --metadata results/server-20260828/P33/p33_all_sizes_arm_10m.metadata.json \
            --p 0.592746050790 \
            --training-sizes 65,85,130 \
            --heldout-sizes 145,170 \
            --seed-label p33-working-tree-10m \
            --expected-seed 2026093303 \
            --output-dir results/server-20260828/COV46

      - name: Validate original P33 archive was not overwritten
        run: |
          test -f results/server-20260828/P33-cross-size-covariance/summary.json
          python scripts/validate_threshold_rank_covariance_archive.py \
            --batch-metrics results/server-20260828/P33-cross-size-covariance/batch_metrics.csv \
            --summary results/server-20260828/P33-cross-size-covariance/summary.json \
            --json /tmp/p33-archive-contract.json
          python scripts/validate_threshold_rank_covariance_archive.py \
            --batch-metrics results/server-20260828/COV46/batch_metrics.csv \
            --summary results/server-20260828/COV46/summary.json \
            --json /tmp/cov46-archive-contract.json
