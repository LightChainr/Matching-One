prospective_scoring_order:
  - 'Original P48 four pure-power laws, unchanged.'
  - 'Zero-effect benchmark, unchanged.'
  - 'This frozen q=2 correction for P4[S\u0027] only; no target refit.'
  - 'Only afterward: logarithmic or free-exponent alternatives.'

interpretation_gates:
  pass: >-
    Fresh N=185/265 P4[S'] values are jointly compatible with the frozen
    A+B/N prediction and improve materially on the original pure-power drift.
    This supports an ordinary omega=2 even-scalar correction to the T4 sector,
    but does not prove the microscopic operator identity.
  fail: >-
    If fresh data reject both the original pure power and this q=2 correction,
    do not retune B. Move to the separately motivated logarithmic/Jordan or
    additional-sector hypotheses with new preregistration.
