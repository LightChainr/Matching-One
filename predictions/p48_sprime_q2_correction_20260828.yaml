schema_version: 1
status: frozen_secondary_model
frozen_at_utc: '2026-08-28T13:11:00Z'
issue: 48
purpose: >-
  Freeze one theory-motivated correction to the P4[S'] derivative-spectrum law
  before fresh N=185/265 statistics are examined. This is a retrospective
  design artifact, not confirmatory evidence.

source:
  dataset_commit: 84f1464b8163cce51b573f80b9ac7300d710bf35
  projectors: results/server-20260828/P48-retrospective/projectors.csv
  covariance: results/server-20260828/P48-retrospective/stacked_covariance.csv
  sizes_N: [65, 85, 130, 145, 170]
  note: >-
    P33/P48-retrospective predates this freeze and is used only to select and
    estimate the secondary model. Fresh counters at N=185/265 are required
    for any confirmatory use.

observable:
  name: P4_S_prime
  definition: '(S_prime(theta_first)-S_prime(theta_second))/DeltaCos4'
  leading_power: 'N^(-5/4)'
  scaled_observable: 'Y_N = N^(5/4) * P4_S_prime'

model:
  name: q2_even_scalar_correction
  equation_scaled: 'Y_N = A + B/N'
  equation_raw: 'P4_S_prime = N^(-5/4) * (A + B/N)'
  length_relative_correction_q: 2
  rationale: >-
    Multiplying the matching-odd thermal spin-4 sector T4 by the lowest
    matching-even scalar correction with length exponent omega=2 preserves
    matching parity and H4 while producing a relative L^-2 = N^-1 term.
    This is the minimal local-RG correction already singled out by the
    post-annihilator selection-rule analysis; it is preferred as the single
    frozen secondary correction over an unconstrained free exponent.

fit:
  method: GLS
  covariance: full_synchronized_delete_one_batch
  used_all_retrospective_sizes: true
  A: 3.203310807356976
  B: -90.59560328584558
  covariance_AB:
    - [0.1003546426313145, -7.164152468416187]
    - [-7.164152468416186, 540.1590397230893]
  chi_square: 1.8923495665261716
  dof: 3
  comparison_pure_power:
    equation_scaled: 'Y_N = A'
    A: 2.00173744
    A_se: 0.07304917
    chi_square: 17.08706580960527
    dof: 4

retrospective_train_holdout_diagnostic:
  train_N: [65, 85, 130]
  heldout_N: [145, 170]
  q2_model_heldout_chi_square: 1.1249401555843164
  heldout_dof: 2
  pure_power_heldout_chi_square: 10.190811422597028
  warning: >-
    This comparison uses already observed P48-retrospective targets and is
    model-development evidence only. It must not be reported as a prospective
    pass.

