schema: p48-sprime-correction-target-extension-v2
status: frozen-before-N185-N265-target-reveal
purpose: >-
  Extend the already-frozen P48 S-prime correction competitors to the new
  prospective N=185,265 geometries without refitting any coefficient.
source:
  canonical_scorer: scripts/score_p49_fullcurve_doubling.py
  canonical_main_commit: 204a3eb42862a23e7a3520695be44f5fda97bd65
  chronology: >-
    The q=2 and rank-2 Jordan/log parameter vectors below predate the fresh
    N=130/170 P49 counters. Those fresh counters replicated both alternatives;
    they are not used to change the coefficients here.
  prospective_target_sizes: [185, 265]
observable:
  raw: P4_S_prime
  scaled: y_N = N^(5/4) * P4_S_prime
models:
  pure_Nminus5_4:
    role: original P48 baseline
    raw_formula: P4_S_prime = A * N^(-5/4)
    parameters: [1.9434247576878727]
    parameter_covariance:
      - [0.005868307572059406]
  q2_even_scalar:
    role: first surviving frozen correction model in P49 chronology
    raw_formula: P4_S_prime = A*N^(-5/4) + B*N^(-9/4)
    scaled_formula: y_N = A + B/N
    parameters: [3.203310807356976, -90.59560328584558]
    parameter_covariance:
      - [0.1003546426313145, -7.164152468416187]
      - [-7.164152468416186, 540.1590397230893]
    targets:
      185:
        scaled_mean: 2.7136048436497027
        scaled_source_se: 0.19668994042701207
        raw_mean: 0.003977241343518155
      265:
        scaled_mean: 2.8614406062783133
        scaled_source_se: 0.23233037114485428
        raw_mean: 0.002676254394619538
    scaled_target_prediction_covariance:
      - [0.03868693, 0.04561299]
      - [0.04561299, 0.05397740]
  rank2_jordan_log:
    role: second frozen correction model; descriptive P49 chi-square was smaller but does not reverse chronology
    raw_formula: P4_S_prime = N^(-5/4) * (A + B*log(N))
    scaled_formula: y_N = A + B*log(N)
    parameters: [-2.422594685734799, 1.016646899281392]
    parameter_covariance:
      - [1.251237089769748, -0.286289830474317]
      - [-0.286289830474317, 0.065785221364566]
    targets:
      185:
        scaled_mean: 2.8846638769766324
        scaled_source_se: 0.2344225574126884
        raw_mean: 0.004227956940935456
      265:
        scaled_mean: 3.2500203406819943
        scaled_source_se: 0.32328609208512216
        raw_mean: 0.003039686093874873
    scaled_target_prediction_covariance:
      - [0.05495394, 0.07548585]
      - [0.07548585, 0.10451390]
scoring_order:
  - pure_Nminus5_4
  - q2_even_scalar
  - rank2_jordan_log
  - zero_effect
  - free_exponent_or_additional_terms
rules:
  - Do not refit q2 or Jordan/log parameters using N=130,170,185,265.
  - The fresh N=130/170 P49 run is replication evidence only, not training data for this extension.
  - Score target sampling covariance together with the committed source-parameter covariance.
  - Do not use this derivative-channel test to alter Issue #43 central-amplitude predictions.
  - A Jordan/log pass is not by itself an LCFT operator identification.
