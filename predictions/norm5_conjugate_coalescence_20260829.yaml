version: 1
created: 2026-08-29
status: prospective_before_noncyclic_C_target_reveal
issue: 205
program: same_parent_conjugate_norm5_coalescence
purpose: >-
  Test whether the post-N290 spin-4 transfer picture survives an unconfounded
  same-parent conjugation experiment and a cyclic-to-noncyclic quotient change
  at fixed N, without using a radial exponent, p_c fit, or source amplitude.

observable:
  topology_channel: cross
  combination: matching_difference
  definition: M_G(p) = R_G_cross(p) - R_matching_cross(1-p)
  p_ref: 0.59274605079
  coordinate: fixed_probability
  geometry_statistic: raw_M_per_geometry
  comparison: same_N_affine_harmonic_residual
  semantic_rule: identical_descriptor_for_A_B_C

geometry:
  N325:
    parents: [[8, 1], [7, 4]]
    observed_multiplier: [2, -1]
    conjugate_multiplier: [2, 1]
    A: [17, 6]
    B: [18, 1]
    C: [15, 10]
    smith_A: [1, 325]
    smith_B: [1, 325]
    smith_C: [5, 65]
  N425:
    parents: [[9, 2], [7, 6]]
    observed_multiplier: [2, 1]
    conjugate_multiplier: [2, -1]
    A: [16, 13]
    B: [19, 8]
    C: [20, 5]
    smith_A: [1, 425]
    smith_B: [1, 425]
    smith_C: [5, 85]

model_definition: >-
  At each fixed N, for one reflection-even square harmonic H_s assume only
  M(theta)=S_N+A_N*cos(s*theta). Eliminate both S_N and A_N with the observed
  A/B/C triple. No cross-size law enters the residual.

primary_H4:
  score_order: 1
  N325:
    interpolation: M_C = (11/5)*M_A - (6/5)*M_B
    integer_residual_C_A_B: [5, -11, 6]
    null: 5*M_C - 11*M_A + 6*M_B = 0
    conjugate_ratio: (M_C-M_A)/(M_C-M_B) = 6/11
  N425:
    interpolation: M_C = -(13/20)*M_A + (33/20)*M_B
    integer_residual_C_A_B: [20, 13, -33]
    null: 20*M_C + 13*M_A - 33*M_B = 0
    conjugate_ratio: (M_C-M_A)/(M_C-M_B) = 33/13
  joint_score: covariance_aware_two_size_residual_vector

fixed_angular_adversaries:
  score_after_primary: true
  H8:
    N325:
      weight_A: 22517/44795
      weight_B: 22278/44795
      integer_residual_C_A_B: [44795, -22517, -22278]
    N425:
      weight_A: 89531/242420
      weight_B: 152889/242420
      integer_residual_C_A_B: [242420, -89531, -152889]
  H12:
    N325:
      weight_A: 363263/7144145
      weight_B: 6780882/7144145
      integer_residual_C_A_B: [7144145, -363263, -6780882]
    N425:
      weight_A: 181189/68620
      weight_B: -112569/68620
      integer_residual_C_A_B: [68620, -181189, 112569]

excluded_from_primary:
  - N^-13/8_radial_transfer
  - q2_or_Jordan_correction
  - fitted_parent_amplitude
  - fitted_p_c
  - root_or_intrinsic_center
  - target_selected_harmonic

covariance_contract:
  within_size: >-
    A/B/C must be generated under one geometry-independent priority field.
    Run C-vs-A and C-vs-B with identical seed and replica counters and verify
    the duplicated C threshold stream exactly before using synchronized batches.
  across_sizes: independent_seeds
  evidence_unit: >-
    The A/B/C residuals and any full-curve, derivative, root, or score-mode
    views derived from these same streams are one correlated raw-data block.

interpretation:
  H4_passes_both_sizes: >-
    Strong support that the angular transfer survives conjugation and the
    cyclic-to-noncyclic quotient change; proceed to norm-4 with the quotient
    confound materially reduced.
  H4_fails_but_fixed_H8_or_H12_passes: reopen_angular_representation
  all_fixed_harmonics_fail_at_C: prioritize_quotient_arithmetic_or_nonlocal_topology
  underpowered: accumulate_more_samples_without_changing_the_frozen_residuals
