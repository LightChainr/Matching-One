common_field_contract:
  requirement: >-
    For each N run C-vs-A and C-vs-B with identical seed and counter interval,
    with C in the same slot in both runs. Verify the C histogram is byte-identical
    before treating the two runs as one synchronized three-geometry block.
  primary_uses_historical_P57_AB: false
  historical_P57_AB_role: sensitivity_only
  covariance: synchronized_delete_one_over_A_B_C

pilot_gate:
  first_samples_per_pair: 1000000
  second_samples_per_pair_if_needed: 10000000
  target_means_forbidden_for_model_choice: true
  use_pilot_for:
    - variance_of_frozen_linear_residuals
    - throughput
    - common_field_identity_check
  promotion_rule: >-
    Promote only if information per CPU is competitive with or mechanistically
    more valuable than immediately opening the frozen balanced norm-4 production.

interpretation:
  H4_passes_both: >-
    Supports the same-N H4 angular law across a cyclic/noncyclic Smith-class
    change and removes a major arithmetic confounder for norm-4.
  fixed_other_harmonic_passes: >-
    Reopen angular representation before norm-10 tomography.
  all_fixed_harmonics_fail_at_C: >-
    Prioritize quotient arithmetic or nonlocal/topological response before
    attributing noncyclic norm-4 failure to q2/Jordan.

forbidden:
  - fit_a_free_harmonic_from_C_target
  - use_13_over_8_or_pc_to_rescue_the_same_N_primary
  - assume_C_common_randomness_without_byte_identity_gate
  - count_this_as_independent_of_any_reused_historical_P57_sensitivity_view
