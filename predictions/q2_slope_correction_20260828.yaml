  N185: 1.7461173031007646
  N265: 1.7452582552821630
  N290: 1.7450870011372910
next_models:
  - B_N = B_inf + (b + c*log(N))/N
  - B_N = B_inf + b/N + c/N^2
  - direct correction models fit/scored inside synchronized full-curve jackknife
rules:
  - Do not score the superseded OLS forecasts against N185/N265/N290.
  - Preserve the original bare 2^(3/8) slope null as the historical primary test.
  - Any replacement correction model must be frozen before its target lineage is revealed and must use the full synchronized covariance.
  - The failure of a common q2 slope coefficient does not invalidate the q2 correction already frozen for the distinct P4[S'] observable; different observables can have different correction amplitudes.
interpretation: >-
  The resolved slope correction is more structured than a single universal
  1/N multiplier. A logarithmically enhanced q2 term is particularly natural
  at c=0, but it remains a hypothesis until a covariance-aware model is frozen
  and tested prospectively.
