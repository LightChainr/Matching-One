version: 1
frozen_at: 2026-08-28
status: structural_analysis_contract
claim_level: exploratory_plus_exact_combinatorics
purpose: >-
  Recast monotone wrapping threshold ranks as activation/reliability signatures,
  record exact majority/Beta and Gaussian shape baselines, and freeze the next
  bivariate exact analysis for the C4 self-matching sequence. This does not
  change any existing norm-5, P48, or Pell preregistration.

activation_signature:
  event: monotone_torus_wrapping_boolean_event
  layer_success_count: 'a_k = number of successful k-subsets'
  domination: 'd_k = a_k / C(N,k)'
  activation_rank: 'K = first occupied rank at which the event is true'
  exact_cdf: 'P(K <= k) = d_k'
  signature_mass: 'q_k = d_k - d_(k-1)'
  reliability_mixture: 'F(p) = sum_r q_r I_p(r,N-r+1)'
  self_matching_symmetry:
    domination: 'd_k + d_(N-k) = 1'
    activation_signature: 'q_k = q_(N+1-k)'

beta_majority_signature:
  statement: >-
    Exact F(p)=I_p(s,s) has the same domination/activation signature as
    majority on 2s-1 relevant variables with N-(2s-1) dummy variables.
  successful_layer_count: >-
    a_k = sum_{j=s}^{2s-1} C(2s-1,j) C(N-(2s-1),k-j)
  minimum_layer: 'a_s = C(2s-1,s)'
  controls:
    N10_Beta3:
      N: 10
      s: 3
      required_a3: 10
      role: exact_control_pending_direct_count_regression
    N26_Beta5:
      N: 26
      s: 5
      required_a5: 126
      observed_a5_from_PR152: 78
      role: post_target_structural_interpretation
      conclusion: majority_signature_obstruction
    N26_Beta7:
      N: 26
      s: 7
      required_a5: 0
      observed_a5_from_PR152: 78
      role: post_target_structural_interpretation
      conclusion: minimum_support_obstruction

shape_baselines:
  centered_function: 'M_s(p)=2 I_p(s,s)-1'
  beta_density_center: 'd_s = Beta(s,s) density at p=1/2'
  exact:
    kappa3: '-2(s-1)/d_s^2'
    kappa5: '12(s-1)(s-2)/d_s^4'
  rows:
    s3:
      kappa3: '-256/225'
      kappa5: '32768/16875'
    s5:
      kappa3: '-131072/99225'
      kappa5: '4294967296/1093955625'
    s7:
      kappa3: '-4194304/3006003'
      kappa5: '43980465111040/9036054036009'
  gaussian_majority_limit:
    kappa3: '-pi/2'
    kappa3_decimal: '-1.57079632679489661923'
    kappa5: '3*pi^2/4'
    kappa5_decimal: '7.40220330081701896412'
    interpretation: >-
      Mechanism-level null for the universal threshold profile. Compare jointly
      with any rational candidate such as kappa3=-5/3; do not select a function
      from kappa3 alone.

kappa3_signature_identity:
  center_density: 'h_r = N*C(N-1,r-1)/2^(N-1)'
  slope: 'A = sum_r q_r h_r = F_prime(1/2)'
  tilted_signature: 'pi_r = q_r h_r / A'
  exact: >-
    kappa3 = [E_pi((2K-N-1)^2) - (N-1)] / A^2
  bridge:
    - threshold_rank_histogram
    - Russo_pivotal_mass
    - Potts_thermal_cumulants

anisotropic_boolean_tomography:
  product_measure: 'p_i = 1/2 + sigma_i lambda'
  exact_expansion: >-
    E_lambda[f] = sum_S fhat(S) (2 lambda)^|S| product_(i in S) sigma_i
  lambda_level_relation: >-
    coefficient(lambda^r) = 2^r sum_(|S|=r) sigma_S fhat(S)
  N10_PR148_retrospective:
    Rminus: '(5/4) lambda - 4 lambda^5'
    signed_level_sums:
      r1: '5/8'
      r3: '0'
      r5: '-1/8'
    note: >-
      Do not assume this sparsity persists. The isotropic Beta signature does not
      determine the anisotropic Fourier/Banzhaf spectrum.

next_exact_analysis_after_PR152:
  target: N26_C4_self_matching_bivariate_layer_table
  no_new_randomness: true
  required_table: '(k_even,k_odd) -> successful configuration counts'
  reconstruct:
    - isotropic_domination_vector_and_activation_signature
    - exact_R_t_lambda_polynomial
    - signed_lambda_Fourier_Banzhaf_level_sums
    - mixed_thermal_anisotropy_derivatives
    - channel_specific_tables_before_matching_difference_reduction
  frozen_exact_checks:
    - reproduce_committed_N26_isotropic_polynomial
    - mirror_activation_signature_under_self_matching
    - enforce_exchange_parity_of_t_lambda_monomials
    - direct_finite_difference_matches_interaction_reconstruction
  forbidden:
    - generalized_Beta_fit_after_N26_failure
    - assume_N10_lambda_sparsity_at_N26
    - reinterpret_post_target_N26_structure_as_prospective

