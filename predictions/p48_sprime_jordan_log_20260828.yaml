cross_channel_guard:
  statement: >-
    A small or null logarithmic coefficient in central P4[D] does not force the
    derivative coefficient in P4[S'] to vanish. In a scaling-function form the
    two probe different Taylor coefficients: D samples the even z coefficient
    at z=0, while S' samples the first derivative of the odd z coefficient.
  implication: >-
    Gaussian-doubling success of central D constrains but does not by itself
    exclude a derivative-specific Jordan logarithm in S'.

prospective_scoring_order:
  - 'Original P48 four pure-power laws, unchanged.'
  - 'Zero-effect benchmark, unchanged.'
  - 'Previously frozen q=2 correction P4[S prime]=N^-5/4(A+B/N), no target refit.'
  - 'This rank-2 Jordan-log adversary, no target refit.'
  - 'Only afterward: free exponent or additional-sector models.'

interpretation_gates:
  q2_wins: >-
    Prefer an ordinary omega=2 even-scalar correction over a Jordan explanation
    for the observed S' drift; do not claim that logarithmic structure is absent
    elsewhere in the theory.
  log_wins: >-
    Treat as evidence that the level-4 thermal spin-4 sector couples to a
    logarithmic partner. Then test a shared scaling-function/Jordan structure
    across D, S', Gaussian-multiplier residuals, and additional derivatives.
  both_fail: >-
    Do not retune either correction. Enlarge the operator-sector model under a
    new preregistration.
