status: frozen_before_fullcurve_N290_reveal
created_date: 2026-08-28
purpose: >-
  Predict the full-curve center-slope ratio on the third Gaussian doubling lineage
  145->290 using only the clean fresh N65->130 and N85->170 P49 slope data.

source:
  report: results/server-20260828/P49-fullcurve-doubling-100m/REPORT.md
  score: results/server-20260828/P49-fullcurve-doubling-100m/analysis/score.json
  clean_seed: 2026104501
  clean_counters: "[5000000000,5100000000)"
  lineages_used:
    - parent_N: 65
      child_N: 130
      slope_parent: 8.379157434038998
      slope_child: 10.842491563759214
      slope_ratio: 1.2939835119594856
