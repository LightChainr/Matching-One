      D: 1
      N: 10864
      E4: '0.000277726626463677567957873044364'
      N_E4: '3.01722206990139309829433275397'

conditional_matching_shape_model:
  model: 'DeltaM_H4(N,tau) = C_lattice * N^(-13/8) * E4(tau)'
  role: >-
    Strong lattice-to-CFT shape hypothesis. C_lattice is unknown but common for
    a fixed microscopic convention; amplitude-free ratios are therefore testable.
  square_torus_residual_exponent_in_N: '-13/8'
  pell_extra_shape_exponent_in_N: '-1'
  pell_H4_residual_exponent_in_N: '-21/8'
  thermal_slope_exponent_in_N: '3/8'
  pell_H4_root_component_exponent_in_N: '-3'
  pell_H4_root_component_exponent_in_L: '-6'
  asymptotic_cross_family_target:
    expression: >-
      [N_Dminus2^(21/8) DeltaM_Dminus2] /
      [N_Dplus1^(21/8) DeltaM_Dplus1] -> -2
    target: '-2'
  moderate_pair:
    D_minus2:
      a: 19
      b: 11
      N: 418
      E4: '-0.0145179091920255362182033297345'
    D_plus1:
      a: 26
      b: 15
      N: 780
      E4: '0.00386292016315336617388415026928'
    finite_N_scaled_N21over8_ratio:
      expression: '(418*E4_418)/(780*E4_780)'
      target: '-2.0140489558737853'
    finite_N_raw_DeltaM_ratio:
      expression: '(418/780)^(-13/8) * E4_418/E4_780'
      target: '-10.356919847162752'
    note: >-
      Score signed observables with a declared channel/orientation convention.
      The finite-N E4 ratio is stronger than replacing it by the asymptotic -2.

spin12_interpretation:
  role_in_issue57: empirical_same_radial_angular_alias
  do_not_change_issue57_frozen_score: true
  thermal_family_bound:
    minimum_descendant_level_for_spin12: 12
    minimum_dimension: '53/4'
  standard_nondiagonal_loop_spectrum_at_Q1:
    beta_squared: '2/3'
    dimension_formula: 'x(r,s) = -1/12 + r^2/3 + 3 s^2/4'
    spin: 'r*s'
    fixed_spin_lower_bound: 'x >= |spin| - 1/12'
    spin12_lower_bound: '143/12'
    nearby_allowed_minimum: 'x=12'
  consequence: >-
    A norm-5 win for a same-N^-13/8 H12 sign should be treated as strong
    evidence against the ordinary local thermal-Q4 identification, not merely as
    replacement of one peer local operator by another.

recommended_validation_order:
