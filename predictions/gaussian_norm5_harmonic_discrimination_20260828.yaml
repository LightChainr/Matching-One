discrimination:
  key_fact: H4_and_H12_predict_opposite_child_signs
  pure_model_scoring_order:
    - H4
    - H12
    - H8
    - zero_effect
  mixture_model:
    formula: >-
      DeltaM_N=N^(-13/8)*(A4*DeltaCos4+A12*DeltaCos12)
    fit_only_after_pure_models: true
    coefficients_shared_across_both_lineages: true
  forbidden_primary_model:
    - separate_radial_exponent_for_each_harmonic
    - post_reveal_change_of_multiplier_or_child_order

statistical_contract:
  clean_source_and_RNG_policy: required_from_issue_39
  fresh_parent_and_child_runs: true
  minimum_batches: 100
  child_sample_counts:
    selected_from_predeclared_power_pilot: true
    candidate_grid:
      - 500000000
      - 1000000000
      - 2000000000
      - 4000000000
  paired_motif_controls:
    issue: 40
    use_only_if_frozen_on_independent_pilot: true
  covariance:
    full_parent_child_covariance_if_coupled: true
    report_diagonal_sensitivity: true
  primary_residual:
    formula: DeltaM_child_minus_H4_target_times_DeltaM_parent
    joint_two_lineage_score: true

full_curve_extension:
  gated_on_fixed_p_power: true
  thermal_levels: [0.0, 0.025, 0.05]
  require:
    - thermal_even_matching_odd_projector
    - slope_ratio
    - direct_and_linearized_root_ratio
    - full_batch_covariance

forbidden:
  - change_lineage_sign_after_reveal
  - omit_N325_or_N425_by_significance
  - use_child_results_to_select_sample_count
  - pool_retrospective_and_prospective_scores_without_separation
  - reinterpret_a_failed_H4_sign_as_subleading_noise_without_scoring_H12
