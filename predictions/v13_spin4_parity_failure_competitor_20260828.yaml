invalid_reason: >-
  The original artifact used the dual/tricritical Kac polynomial
  ((3r-2s)^2-1)/24 while labeling R_<1,3> as a field of the critical Potts
  branch. For critical Potts percolation Q=1, beta^2=2/3 and the correct
  convention is ((2r-3s)^2-1)/24. Therefore V_<1,3> has h=2, x=4, not h=1/3,
  x=2/3, and there is no critical-Potts V13 level-4 x=14/3 / N^-4/3 target of
  the form frozen in version 1.
scientific_effect: >-
  None of the N=185/N=265 target data had been produced when this invalidation
  was committed. The erroneous N^-4/3 model must not enter prospective scoring,
  model selection, or evidence counts. Repository history retains the exact
  original prediction and the correction timing.
