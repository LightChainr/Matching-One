    normalization: angular_normalized
    quantity: orientation_contrast

semantic_rule: >-
  Every source and target curve is reconstructed from the cross-channel
  threshold-rank K_minus/K_plus contract. Each P4 is normalized locally by its
  own signed DeltaCos4 before cross-size comparison. Therefore no cross/either
  map and no cross-size angular sign factor is applied: every primitive
  descriptor maps identically to itself with scale +1 and offset 0.

semantic_requirements:
  - validate every primitive descriptor through the registered map layer
  - require identity scale and zero offset for every primitive cross-size comparison
  - fail before the frozen kernel if any descriptor changes
  - append the primitive descriptors and applied identity maps to score output
  - preserve the 2026-08-28 frozen kernel contract byte-for-byte

