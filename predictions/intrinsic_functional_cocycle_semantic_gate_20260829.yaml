purpose: >-
  Add explicit primitive observable descriptors to the already-frozen intrinsic
  full-curve q=2/Jordan cocycle scorer without changing levels, lineages,
  model constants, covariance grouping, target data, or score order.

primitive_descriptors:
  Mbar_center:
    channel: cross
