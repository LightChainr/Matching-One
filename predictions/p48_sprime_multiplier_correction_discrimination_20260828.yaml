transfer_formula:
  general: >-
    P4Sprime(QN)/P4Sprime(N) = r4(Q)*Q^(-5/4)*Y(QN)/Y(N),
    where r4 is the exact Gaussian H4 angular ratio.
  statistic: >-
    Score fixed residuals X_child-r_model(N,Q)*X_parent, not raw ratios, and
    propagate both source-model coefficient covariance and fresh target
    covariance.

