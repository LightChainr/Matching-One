chronology_and_claim_guard:
  - >-
    q2 was frozen before the Jordan-log adversary; the prospective P48 scoring
    order remains pure powers, zero, q2, Jordan, then freer models.
  - >-
    Norm-2 sizes have retrospective P33 outcomes, so fresh norm-2 transfer is a
    replication/mechanism check rather than geometry-blind held-out evidence.
  - >-
    Norm-5 child sizes are prospective provided N325/N425 production begins
    after this corrected artifact is committed.
  - >-
    The version-1 negative normalized ratios remain in git history as a
    definition error; do not use them as a failed physical model.
  - >-
    Do not use a favorable multiplier score to retroactively reorder the P48
    N185/N265 primary scoring chronology.

interpretation:
  pure_wins: >-
    The retrospective S-prime drift was statistical/preasymptotic and the
    leading N^-5/4 character is sufficient at fresh precision.
  q2_wins: >-
    Supports the frozen ordinary relative L^-2 correction model; microscopic
    scalar identity remains conditional.
  jordan_wins: >-
    Supports a same-power logarithmic/Jordan correction in the derivative
    channel and motivates a joint generalized-eigenvector semigroup analysis.
  none: >-
    Preserve failure and enlarge the sector model under a new preregistration.
