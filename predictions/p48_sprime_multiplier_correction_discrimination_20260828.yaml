version: 2
frozen_at: 2026-08-28
status: corrected_before_N325_N425_targets
claim_level: C0
issue: 48
related_issue: 64
correction_trigger: PR_73_normalized_P4_definition_audit
purpose: >-
  Use Gaussian parent/child transfer of the normalized P4[S'] projector to
  discriminate the already frozen pure-power, q=2 ordinary-RG, and rank-2
  Jordan-log models without refitting A, B, or the leading exponent. Version 2
  corrects the original sign convention: the H4 angular ratio cancels between
  DeltaS' and the size-local DeltaCos4 denominator. Raw unnormalized contrasts
  elsewhere still retain their angular sign.

observable:
  name: P4_S_prime
  definition: "P4[S'] = DeltaS' / DeltaCos4 at each size"
  leading_exponent_alpha_in_N: '5/4'
  pure_H4_law: "P4[S'] = N^(-5/4) A"
  normalized_multiplier_rule: >-
    P4[S'](Q*N)/P4[S'](N) = Q^(-5/4) * Y(Q*N)/Y(N).
    No H4 angular factor appears after normalization.

source_models:
  q2:
    artifact: predictions/p48_sprime_q2_correction_20260828.yaml
    equation_scaled: 'Y(N)=A+B/N'
    A: '3.203310807356976'
    B: '-90.59560328584558'
    covariance_AB:
      - ['0.1003546426313145', '-7.164152468416187']
      - ['-7.164152468416186', '540.1590397230893']
  jordan_log:
    artifact: predictions/p48_sprime_jordan_log_20260828.yaml
    equation_scaled: 'Y(N)=A+B*log(N)'
    A: '-2.422594685734799'
    B: '1.016646899281392'
    covariance_AB:
      - ['1.251237089769748', '-0.286289830474317']
      - ['-0.286289830474317', '0.065785221364566']

transfer_formula:
  normalized_general: >-
    P4Sprime(QN)/P4Sprime(N) = Q^(-5/4)*Y(QN)/Y(N).
  raw_contrast_general: >-
    DeltaSprime(QN)/DeltaSprime(N) = r4(Q)*Q^(-5/4)*Y(QN)/Y(N).
  statistic: >-
    Score fixed residuals P4_child-r_model(N,Q)*P4_parent, not raw ratios, and
    propagate both source-model coefficient covariance and fresh target
    covariance.

