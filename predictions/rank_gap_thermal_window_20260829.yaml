version: 1
frozen_at: 2026-08-29
status: retrospective_observable_analysis_not_prospective
claim_level: C0
observable: orientation-pooled paired threshold-rank gap G=K_plus-K_minus
purpose: >-
  Convert joint threshold-rank moments already preserved by production into a
  no-free-exponent thermal-window diagnostic. This is a retrospective source
  analysis: the exponent is theory-fixed, but the result is not prospective
  evidence and must not be represented as such.
observable_bridge:
  critical_window: delta_p scales as L^(-1/nu)
  rank_gap: E[G] scales as N times delta_p
  area_relation: N scales as L^2
  percolation_nu: 4/3
  consequence: E[G] scales as N^(5/8)
fixed_exponent_in_N:
  numerator: 5
  denominator: 8
  fitted: false
nuisance_fit:
  common_scaled_amplitude: true
  target_fit_parameters: 1
  degrees_of_freedom: 5
orientation_rule: pool first and second with equal event weight before scoring
uncertainty: recompute every statistic in aligned delete-one-batch replicates
runs:
  - N: 65
    moments: results/server-20260828/P45-root-amplitude/n65.moments.csv
    metadata: results/server-20260828/P45-root-amplitude/n65.metadata.json
  - N: 85
    moments: results/server-20260828/P45-root-amplitude/n85.moments.csv
    metadata: results/server-20260828/P45-root-amplitude/n85.metadata.json
  - N: 130
    moments: results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.moments.csv
    metadata: results/server-20260828/P49-fullcurve-doubling-100m/raw/n130.metadata.json
  - N: 170
    moments: results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.moments.csv
    metadata: results/server-20260828/P49-fullcurve-doubling-100m/raw/n170.metadata.json
  - N: 185
    moments: results/server-20260828/P43-heldout-fullcurve-500m/raw/n185.moments.csv
    metadata: results/server-20260828/P43-heldout-fullcurve-500m/raw/n185.metadata.json
  - N: 265
    moments: results/server-20260828/P43-heldout-fullcurve-500m/raw/n265.moments.csv
    metadata: results/server-20260828/P43-heldout-fullcurve-500m/raw/n265.metadata.json
covariance_contract:
  source_group:
    sizes: [65, 85, 130, 170]
    reason: identical seed and counter interval
  independent_groups:
    - [185]
    - [265]
  warning: matching batch labels do not couple disjoint counter intervals
fixed_ratio_diagnostics:
  - parent: 65
    child: 130
  - parent: 85
    child: 170
secondary_statistics:
  - gap variance and N^(-5/4) scaled view
  - coefficient of variation
  - K_minus K_plus correlation
forbidden:
  - fit the exponent to these six sizes in the frozen score
  - discard a size by residual or significance
  - treat disjoint counter intervals as common randomness
  - call the paired gap reconstructible from marginal histograms
