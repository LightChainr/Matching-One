status: frozen_before_target_reveal
created_date: 2026-08-28
purpose: >-
  Prospectively score the P48 matching-odd derivative channel on the already-running
  N=185 and N=265 full-curve targets. This artifact is secondary to Issue #43's
  original DeltaM/DeltaS endpoints and must be scored only after those endpoints.

observable:
  definition: "Y_N = N^(5/4) * P4[S_prime]"
  projector: "P4[X] = (X(theta_first)-X(theta_second))/DeltaCos4"
  center: "intrinsic finite-size center used by the threshold-rank analysis"

training_only:
  sizes: [65, 85, 130]
  values:
    65: 1.8272614651936119
    85: 2.055214465644394
    130: 2.7021154484851513
  covariance:
    - [0.009073823732175192, 0.0010081292690864222, 0.0063885369893694095]
    - [0.0010081292690864222, 0.013886211517778748, -0.0027633088174404117]
    - [0.0063885369893694095, -0.0027633088174404117, 0.10073850832727799]
  provenance:
    projectors: results/server-20260828/P48-retrospective/projectors.csv
    covariance: results/server-20260828/P48-retrospective/stacked_covariance.csv
  excluded_from_fit: [145, 170]

models:
  pure_power_baseline:
    equation: "Y_N = A"
    source: "original P48 frozen law"
    A: 1.9434247576878727
    A_se: 0.0766048795577632
    targets:
      185: {mean: 1.9434247576878727, source_se: 0.0766048795577632}
      265: {mean: 1.9434247576878727, source_se: 0.0766048795577632}

  rank2_log_primary_correction:
    motivation: >-
      c=0 percolation permits logarithmic/Jordan mixing. The retrospective P48
      S-prime scaled amplitude rises with N, while the central D channel does not
      show the same failure. This is a prospective correction model, not a claim
      that a logarithmic partner has been identified.
    equation: "Y_N = A + B*log(N)"
    fit_method: "GLS on N=65,85,130 using the committed training covariance"
    A: -2.7539493884634396
    B: 1.0923296227893287
    coefficient_covariance:
      - [2.1583975021343988, -0.50055016483320125]
      - [-0.50055016483320125, 0.11639817390048819]
    targets:
      185: {mean: 2.9483999207704414, source_se: 0.32310057051130892}
      265: {mean: 3.340954787622457, source_se: 0.44316733543836162}
    target_source_covariance:
      - [0.10439397866473329, 0.1428792399110507]
      - [0.1428792399110507, 0.19639728719953731]

  analytic_inverse_N_competitor:
    motivation: "ordinary relative L^-2 correction to the leading S-prime law"
    equation: "Y_N = A + B/N"
    fit_method: "GLS on N=65,85,130 using the committed training covariance"
    A: 3.1528570990005798
    B: -88.03321330713665
    coefficient_covariance:
      - [0.15495924527324048, -10.852160862974227]
      - [-10.852160862974227, 789.9165248521779]
    targets:
      185: {mean: 2.6770018919349763, source_se: 0.24641162774047082}
      265: {mean: 2.8206562940679887, source_se: 0.2903523906239357}
    target_source_covariance:
      - [0.06071869028570837, 0.07145989058713698]
      - [0.07145989058713698, 0.08430451074103454]

scoring_order:
  - "finish and report Issue #43 original frozen DeltaM/DeltaS score first"
  - "score original P48 pure-power S-prime law"
  - "score rank2_log_primary_correction"
  - "score analytic_inverse_N_competitor"
  - "report zero-effect benchmark"
  - "only after fixed scores: free exponents, additional logs, or mixtures"

rules:
  - "do not refit any coefficient using N=145,170,185,265 before the fixed scores are reported"
  - "target sampling covariance must be added to the committed source-prediction covariance"
  - "if N=185/265 production has already started, this remains prospective only because target values were unrevealed at commit time"
  - "this artifact does not modify Issue #43's original primary predictions"
