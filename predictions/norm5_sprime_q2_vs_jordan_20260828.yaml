format_version: 1
status: frozen_before_norm5_child_outcomes
purpose: >-
  Secondary no-target-refit readout from Issue #57 threshold-rank data:
  discriminate the already frozen P4[Sprime] pure, q=2, and rank-2 Jordan-log
  radial models using norm-5 parent/child ratios.

channel: angular_normalized_P4_S_prime
primary_issue_57_harmonic_score_unchanged: true

source_models:
  pure_x21:
    formula: 'F(N)=A*N^(-5/4)'
  q2_even_scalar:
    formula: 'F(N)=N^(-5/4)*(A+B/N)'
    A: 3.203310807356976
    B: -90.59560328584558
    source: 'frozen P48 model as implemented in merged PR #73'
  rank2_jordan_log:
    formula: 'F(N)=N^(-5/4)*(A+B*log(N))'
    A: -2.422594685734799
    B: 1.016646899281392
    source: 'frozen P48 Jordan adversary as implemented in merged PR #73'

norm5_lineages:
  '65_to_325':
    pure_ratio: 0.1337480609952844
    q2_ratio: 0.21616280382645803
    jordan_log_ratio: 0.25390652930640595
  '85_to_425':
    pure_ratio: 0.1337480609952844
    q2_ratio: 0.18710164284332514
    jordan_log_ratio: 0.23825677450523705

scoring_order:
  - issue_57_primary_H4_vs_H12_vs_H8_fixed_p_score
  - if_threshold_ranks_exist_score_same_primary_harmonic_on_full_curve
  - score_P4_Sprime_pure_ratio
  - score_P4_Sprime_q2_ratio
  - score_P4_Sprime_jordan_log_ratio
  - only_then_refit_or_add_richer_models

requirements:
  - preserve_Kminus_Kplus_integer_batch_histograms_if_norm5_production_is_run
  - use_angular_normalized_P4_for_these_positive_radial_ratios
  - recompute_intrinsic_center_inside_each_delete_one_batch_replicate
  - preserve_parent_child_covariance_if_streams_are_deliberately_coupled

claim_boundary: >-
  This secondary test does not identify a logarithmic field or V_<1,3> by itself.
  Its purpose is to make the expensive norm-5 run discriminate correction mechanisms
  already frozen before child outcomes, without changing the primary H4/H12 design.
