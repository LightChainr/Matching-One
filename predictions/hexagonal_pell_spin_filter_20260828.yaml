version: 1
frozen_at: 2026-08-28
claim_level: C0
status: frozen_before_dedicated_pell_hexagonal_square_site_targets
related_issues: [57, 103, 121, 145]
purpose: >-
  Use the 60-degree automorphism of the hexagonal torus as an independent
  spin filter. A genuine spin-4 torus one-point is forbidden at the
  equianharmonic modulus, whereas spin 12 is allowed. Positive Pell
  approximants approach that modulus with O(L^-2) shape error.

hexagonal_modulus:
  tau: '1/2 + i*sqrt(3)/2'
  modular_statement: 'E4(tau_hex)=0'
  spin_selection:
    H4: forbidden
    H12: allowed

pell_family:
  equation: 'x^2 - 3 m^2 = 1'
  periods: ['v1=(2m,0)', 'v2=(m,x)']
  tau: '1/2 + i*x/(2m)'
  shape_error: 'O(m^-2)'
  targets:
    - {x: 7, m: 4, N: 56, E4_over_E4_i: '0.0362565052970333734263688162329262'}
    - {x: 26, m: 15, N: 780, E4_over_E4_i: '0.00265353663269522063293766164637801'}
    - {x: 97, m: 56, N: 10864, E4_over_E4_i: '0.000190777377235422695593606819608911'}

frozen_hypotheses:
  H4_thermal_level4:
    generic_matching_residual_length_exponent: '13/4'
    pell_matching_residual_length_exponent: '21/4'
    generic_root_bias_length_exponent: '4'
    pell_root_bias_length_exponent: '6'
    prediction: >-
      The spin-4 amplitude has a simple modular zero at tau_hex; Pell shape
      mismatch supplies an additional L^-2 suppression.
  H12_same_radial_alias:
    generic_matching_residual_length_exponent: '13/4'
    pell_matching_residual_length_exponent: '13/4'
    generic_root_bias_length_exponent: '4'
    pell_root_bias_length_exponent: '4'
    prediction: >-
      Spin 12 is invariant under the 60-degree hexagonal torus automorphism,
      so the modular zero that suppresses H4 does not apply.

primary_future_score:
  order:
    - H4_thermal_level4_fixed_exponents
    - H12_same_radial_alias_fixed_exponents
    - zero_effect
    - only_then_free_exponent_or_mixtures
  rules:
    - do_not_fit_the_pell_exponent_before_fixed_scores
    - use_general_period_matrix_homology
    - preserve_full_threshold_rank_histograms_if_production_is_run
    - N56_is_control_or_engineering_scale_N780_is_first_serious_shape_target
    - norm5_issue57_remains_higher_near_term_compute_priority

interpretation_boundary:
