formula_for_same_harmonic_power_transfer: >-
  For a relative same-H4 correction C*N^(-beta),
  E_Q = r4_Q*Q^(-alpha)*C*N^(-alpha-beta)*(Q^(-beta)-1).
  Therefore E5/E2 is fixed by the two multiplier norms and H4 angular ratios.

formula_for_general_subleading_harmonic: >-
  If a subleading angular function f has multiplier ratio rf_Q rather than the
  leading H4 ratio r4_Q, then
  E_Q = C*N^(-alpha-beta)*Q^(-alpha)*(rf_Q*Q^(-beta)-r4_Q)*f_parent.
  This must be used for nonlinear H4/H12 mixtures such as T4*I4^2.

scoring_order_after_primary_norm5_harmonic_score:
  - pure_leading_power_residual_zero
  - logarithmic_Jordan_rank2_transfer
  - relative_length_q2
  - relative_length_q3
  - relative_length_q4
  - nonlinear_T4_I4_squared_aligned
  - relative_length_q6
  - only_then_free_beta_or_multi_correction_models

rules:
  - original_norm5_H4_H12_score_remains_primary
  - do_not_use_this_secondary_artifact_to_change_production_sample_count_after_target_means_are_seen
  - propagate_source_E2_uncertainty_and_fresh_E5_sampling_covariance
  - if_all_fixed_residual_models_are_underpowered_report_a_power_limit_not_a_winner
  - do_not_interpret_q3_as_2_times_omega_3_over_2_without_an_operator_derivation
  - never_apply_a_pure_H4_transfer_factor_to_a_known_H4_H12_composite_without_recomputing_its_angular_ratio
