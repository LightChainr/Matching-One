  norm2: 'E_2 = DeltaM_(2N) + 2^(-13/8) * DeltaM_N'
  norm5: 'E_5 = DeltaM_(5N) - (-14/25)*5^(-13/8)*DeltaM_N'
  note: >-
    Residuals must be evaluated in exact Gaussian genealogy order. Fresh parent
    and child samples are allowed; covariance must be propagated according to
    the frozen RNG policy.

