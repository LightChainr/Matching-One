version: 1
frozen_date: 2026-08-28
status: preregistered_before_N325_N425_target_runs
purpose: >-
  Cross-norm spectroscopy of the correction left after the frozen leading
  x=21/4 H4 term is annihilated. This is secondary to the original norm-5 H4
  versus H12 score and does not modify any earlier prediction artifact.

leading_model:
  exponent_alpha_in_N: '13/8'
  norm2_multiplier: '1+i'
  norm2_H4_angular_ratio: '-1'
  norm5_multipliers: ['2-i', '2+i']
  norm5_H4_angular_ratio: '-14/25'

residual_definition:
  general: 'E_Q = DeltaM_(Q*N) - r_Q * Q^(-13/8) * DeltaM_N'
  norm2: 'E_2 = DeltaM_(2N) + 2^(-13/8) * DeltaM_N'
  norm5: 'E_5 = DeltaM_(5N) - (-14/25)*5^(-13/8)*DeltaM_N'
  note: >-
    Residuals must be evaluated in exact Gaussian genealogy order. Fresh parent
    and child samples are allowed; covariance must be propagated according to
    the frozen RNG policy.

