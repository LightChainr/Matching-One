purpose: >
  Freeze the intrinsic quantile-center monomials of the nonlinear thermal
  field before any P43 or Issue #57 coordinate is scored against them.
  Retrospective P49 N=130/170 reconstructions are development-only.

frozen_u: [0.025, 0.05]

definitions:
  p_minus_u:
    equation: Mbar_N(p_minus^u) = -u
  p_plus_u:
    equation: Mbar_N(p_plus^u) = +u
  c_u:
    equation: (p_plus^u + p_minus^u) / 2
  w_u:
    equation: (p_plus^u - p_minus^u) / 2
  Q_N:
    equation: c_0.05 - c_0.025
    cancels: [p_c, common_center_shift]
    leading_n_exponent: "-3/4"
    role: even_nonlinear_thermal_coordinate

predictions:
  Q_N_scaling: "C(u1,u2) N^{-3/4}"
  doubling_ratio:
    formula: "Q_{2N} / Q_N = 2^{-3/4}"
    float: 0.5946035575013605
    applies_only_to_true_doubling_lineages:
      - 65 -> 130
      - 85 -> 170
      - 145 -> 290
    does_not_apply_to: P49 children 130 and 170 taken as a pair
  w_u_scaled:
    formula: w_u N^{3/8}
    role: thermal_metric_drift
    connects_to: resolved_P49_center_slope_correction

oracles:
  n10_c4_self_matching:
    M: 2 I_p(3,3) - 1
    consequence: c_u = 1/2 and Q_10 = 0 by oddness about p=1/2
    claim_level: C1

use_now:
  - Recompute p_plus_minus inside each delete-one replicate.
  - Treat P49 N=130/170 as a numeric/label check, not a held-out score.
  - Keep N=185/265 and N=325/425 out of this freeze as targets.
  - A future 145->290 full-curve score may use the frozen doubling ratio.

