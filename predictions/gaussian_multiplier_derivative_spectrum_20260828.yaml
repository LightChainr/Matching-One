purpose: >-
  Parameter-free Gaussian-multiplier eigenvalue test of the four frozen
  matching-parity derivative channels. Old P33 outcomes at the norm-2 sizes
  exist, so norm-2 is a fresh-seed confirmation/replication rather than a
  geometry-blind held-out test. Norm-5 targets remain prospective.

channel_models:
  identity_even_S:
    field_role: matching_even_identity_family_spin4_candidate
    observable: 'P4[S]'
    exponent_alpha_in_N: '1'
  identity_even_Dprime:
    field_role: matching_even_identity_family_spin4_candidate
    observable: "P4[D']"
    exponent_alpha_in_N: '5/8'
  thermal_odd_D:
    field_role: matching_odd_thermal_family_spin4_candidate
    observable: 'P4[D]'
    exponent_alpha_in_N: '13/8'
  thermal_odd_Sprime:
    field_role: matching_odd_thermal_family_spin4_candidate
    observable: "P4[S']"
    exponent_alpha_in_N: '5/4'

thermal_radial_competitor_rule:
  statement: >-
    If a competing matching-odd H4 field has central-D exponent alpha_D in N,
    its first thermal derivative S-prime has exponent alpha_D-3/8. Therefore
    the central and derivative Gaussian multiplier ratios form a linked no-fit
    test; do not fit an independent derivative exponent for the competitor.
  candidates:
    x21_over_4:
      role: primary_thermal_level4_candidate
      central_D_alpha_N: '13/8'
      Sprime_alpha_N: '5/4'
    x14_over_3_V13:
      role: matching_parity_failure_adversary
      central_D_alpha_N: '4/3'
      Sprime_alpha_N: '23/24'
      theory_guard: >-
        The matching-odd assignment is deliberately adversarial and would
        signal failure/mixing of the stronger parity hypothesis in Issue #61.
    x17_over_4_W22:
      role: Q1_logarithmic_leakage_adversary
      central_D_alpha_N: '9/8'
      Sprime_alpha_N: '3/4'

