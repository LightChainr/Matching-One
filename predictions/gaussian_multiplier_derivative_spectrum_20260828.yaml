correction_trigger: PR_73_clean_fullcurve_definition_audit
related_issue: 64
source_parity_issue: 48
purpose: >-
  Parameter-free Gaussian-multiplier eigenvalue test of the four frozen
  matching-parity derivative channels. Version 3 corrects a definition error
  in versions 1-2: the H4 angular sign belongs to an unnormalized exact-lineage
  contrast DeltaX, but cancels in the normalized projector
  P4[X]=DeltaX/DeltaCos4 because DeltaCos4 transforms by the same factor.
  No exponent or amplitude is changed by this correction. Norm-5 targets remain
  prospective.

observable_conventions:
  raw_exact_lineage_contrast:
    definition: 'DeltaX = X(first)-X(second) in Gaussian genealogy order'
    pure_H4_multiplier: 'DeltaX_child/DeltaX_parent = r4 * Q^(-alpha)'
    note: 'r4 carries the angular sign and is negative for the frozen norm-2/norm-5 lineages.'
  normalized_P4_projector:
    definition: 'P4[X] = DeltaX / DeltaCos4, with each size using its own DeltaCos4'
    pure_H4_multiplier: 'P4_child/P4_parent = Q^(-alpha)'
    derivation: >-
      DeltaX_child=r4*Q^(-alpha)*DeltaX_parent and
      DeltaCos4_child=r4*DeltaCos4_parent, so r4 cancels exactly.
  warning: >-
    Never apply r4 a second time to an already-normalized P4 projector. Raw
    matching-function/root contrasts in Issues 49/50/57 still retain their
    angular sign.

channel_models:
  identity_even_S:
    field_role: matching_even_identity_family_spin4_candidate
    observable: 'P4[S]'
    exponent_alpha_in_N: '1'
  identity_even_Dprime:
    field_role: matching_even_identity_family_spin4_candidate
    observable: "P4[D']"
    exponent_alpha_in_N: '5/8'
  thermal_odd_D:
    field_role: matching_odd_thermal_family_spin4_candidate
    observable: 'P4[D]'
    exponent_alpha_in_N: '13/8'
  thermal_odd_Sprime:
    field_role: matching_odd_thermal_family_spin4_candidate
    observable: "P4[S']"
    exponent_alpha_in_N: '5/4'

thermal_radial_competitor_rule:
  statement: >-
    If a competing matching-odd H4 field has central-D exponent alpha_D in N,
    its first thermal derivative S-prime has exponent alpha_D-3/8. For
    normalized P4 projectors both parent/child multipliers are positive
    Q^(-alpha); do not fit an independent derivative exponent.
  candidates:
    x21_over_4:
      role: primary_thermal_level4_candidate
      central_D_alpha_N: '13/8'
      Sprime_alpha_N: '5/4'
    x14_over_3_V13:
      role: matching_parity_failure_adversary
      central_D_alpha_N: '4/3'
      Sprime_alpha_N: '23/24'
      theory_guard: >-
        A matching-odd observation would signal failure/mixing of the stronger
        parity hypothesis in Issue #61.
    x17_over_4_W22:
      role: Q1_logarithmic_leakage_adversary
      central_D_alpha_N: '9/8'
      Sprime_alpha_N: '3/4'

