norm5_same_radial_H12_adversary_for_thermal_rows:
  exact_H12_angular_ratio: '23506/15625'
  note: >-
    This is a model-independent same-radial-exponent H12 alias for the thermal
    D/Sprime rows, not an ordinary x=21/4 thermal-family spin-12 descendant.
  thermal_odd_D:
    expression: '(23506/15625)*5^(-13/8)'
  thermal_odd_Sprime:
    expression: '(23506/15625)*5^(-5/4)'

primary_statistics:
  type: fixed_residual_not_ratio
  definition: 'R_X = X_child - fixed_ratio_X * X_parent'
  rationale: >-
    Residuals remain stable when a parent channel is weak; raw ratios are
    descriptive only.
  covariance: full_aligned_delete_one_batch_covariance_across_channels_and_lineages

intrinsic_coordinate_rule:
  requirement: >-
    Recompute the finite-size center, individual curves, derivatives and P4
    projections inside every delete-one-batch replicate. Do not hold the
    full-sample center fixed in the jackknife.

scoring_order:
  - four_fixed_H4_channel_residuals_individually
  - joint_four_channel_omnibus
  - zero_effect_and_sign_only_benchmarks
  - thermal_x14_and_x17_linked_D_plus_Sprime_adversaries_after_primary_x21_score
  - norm5_thermal_H12_adversary_after_primary_H4_score
  - only_then_channel_specific_correction_or_Jordan_models_already_frozen_elsewhere

rules:
  - exact_Gaussian_genealogy_order
  - no_channel_dropped_by_observed_parent_significance
  - no_independent_derivative_exponent_fit_for_a_fixed_central_radial_competitor
  - norm2_is_replication_not_new_geometry_holdout
  - norm5_is_prospective_if_target_runs_postdate_this_artifact
  - preserve_all_batch_sufficient_statistics_and_failed_scores
