norm5_same_radial_H12_adversary_for_normalized_thermal_P4:
  exact_H4_angular_ratio: '-14/25'
  exact_H12_angular_ratio: '23506/15625'
  normalized_angular_ratio_H12_over_H4: '-1679/625'
  note: >-
    A pure H12 contrast divided by DeltaCos4 does not cancel angular factors;
    its normalized parent/child multiplier is
    (r12/r4)*5^(-alpha)=(-1679/625)*5^(-alpha). This preserves the useful
    opposite-sign H4/H12 discrimination in normalized P4 thermal channels.
  thermal_odd_D:
    expression: '(-1679/625)*5^(-13/8)'
    decimal: '-0.19647793010452894737691277918348770771944832359215'
  thermal_odd_Sprime:
