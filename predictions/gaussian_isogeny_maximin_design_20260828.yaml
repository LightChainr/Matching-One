  - do_not_fit_any_exponent_or_multiplier_on_targets

primitive_multiplier_ranking:
  search_scope: >-
    Parents N=65/85, every primitive Gaussian multiplier of norm 2..65,
    primitive cyclic children only, exact H4/H8/H12 arithmetic.
  top_balanced_edges:
    - N65_to_N325_q5
    - N85_to_N425_q5
    - N65_to_N650_q10
    - N85_to_N850_q10
    - N65_to_N1105_q17
  conclusion: >-
    The two norm-5 children are the first two rows under the frozen balanced
    angular/radial gap per sqrt(child-N) proxy. Norm 10 and 13/17 descendants
    are useful backups but are not competitive first experiments.

nonprimitive_norm4_benchmark:
  why_not_in_primitive_ranking: >-
    Multiplication by 2 has Gaussian norm 4 but content 2. The children are not
    cyclic Z/N quotients, so the current cyclic C++ production engine cannot
    represent them. This is an engine-domain exclusion, not a mathematical
    statement that norm 4 is uninformative.
  semigroup_identity: 'T4 = T2^2 up to the D4-trivial Gaussian unit i'
  rows:
    - parent: {N: 65, first: [8,1], second: [7,4]}
      multiplier: [2,0]
      child: {N: 260, first_lineage: [16,2], second_lineage: [14,8]}
      child_smith_invariants: [2,130]
      quotient_group: 'Z/2 x Z/130'
      exact_angular_ratios: {H4: '+1', H8: '+1', H12: '+1'}
      reference_targets_13_8_4_3_9_8:
        ['+1.279575091295918e-4','+1.917196414683799e-4','+2.559150182591835e-4']
      P4_Sprime_pure_q2_Jordan_ratios:
        ['0.1767766952966369','0.2788973758671766','0.3135726104360514']
    - parent: {N: 85, first: [9,2], second: [7,6]}
      multiplier: [2,0]
      child: {N: 340, first_lineage: [18,4], second_lineage: [14,12]}
      child_smith_invariants: [2,170]
      quotient_group: 'Z/2 x Z/170'
      exact_angular_ratios: {H4: '+1', H8: '+1', H12: '+1'}
      reference_targets_13_8_4_3_9_8:
        ['+9.677497886184368e-5','+1.449986356932917e-4','+1.935499577236874e-4']
      P4_Sprime_pure_q2_Jordan_ratios:
        ['0.1767766952966369','0.2428874893369600','0.2957559508212650']
  equal_budget_comparison:
    primitive_q2_plus_q5_maximin_chi_square: '16.5306'
    idealized_q4_plus_q5_maximin_chi_square: '7.5534'
  engine_decision: >-
    Implement a minimal general-period/Smith-coordinate production backend in
    parallel after the norm-5 design is frozen. Norm 4 is not the first pure-
    model campaign under equal cost, but it is the cheapest direct radial-
    curvature and T4=T2^2 backend-universality test and gives strong q2/Jordan
    separation. Do not delay N325/N425 while building it.
