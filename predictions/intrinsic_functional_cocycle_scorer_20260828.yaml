version: 1
frozen_at: 2026-08-28
status: implementation_frozen_before_N325_N425_reveal
claim_level: C0
related_issues: [48, 57, 101, 119, 125, 138]

observable:
  intrinsic_coordinate: 'u=Mbar_N(p), Mbar=(M_first+M_second)/2'
  frozen_levels: [0.0, 0.025, 0.05]
  D_even: '(P4[D](p_plus_u)+P4[D](p_minus_u))/2'
  S_odd: '(P4[S](p_plus_u)-P4[S](p_minus_u))/2'
  branch: 'T_N(u)=D_even+S_odd'
  scaled_branch: 'Z_N(u)=N^(13/8)*T_N(u)'

lineages:
  - [65, 130, 325]
  - [85, 170, 425]

models_in_scoring_order:
  - id: q2_analytic
    c: '8/5'
    residual: 'Z_5N-c*Z_2N+(c-1)*Z_N'
  - id: jordan_rank2
    c: 'log(5)/log(2)'
    residual: 'Z_5N-c*Z_2N+(c-1)*Z_N'

covariance_contract:
  source_group: [65, 85, 130, 170]
  independent_target_groups: [[325], [425]]
  reason: >-
    The Huawei N325 and N425 production uses disjoint counters from the
    existing source/norm-2 curves and from each other. Do not manufacture
    cross-run covariance by deleting equal numeric batch ids together.
  recompute_inside_delete_one:
    - p0
    - p_plus_minus_at_each_u
    - Mbar_prime
    - P4 projectors
    - center J and Xi
    - every functional residual

center_diagnostics:
  J: 'P4[S_prime]/Mbar_prime'
  J_scaled: 'N^(13/8)*J'
  Xi: 'J/P4[D]'

score_contract:
  - stack both lineages and all three u levels
  - use the summed independent-group jackknife covariance
  - use a covariance pseudoinverse with relative eigenvalue cutoff 1e-10
  - score q2 before Jordan
  - do not select or drop u levels after reveal
  - do not fit a free multiplier until both fixed models are reported
