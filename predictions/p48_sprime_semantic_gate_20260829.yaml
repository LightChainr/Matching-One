purpose: >-
  Add explicit source/target observable semantics to the already-frozen P48
  S-prime prospective score without changing target sizes, model order,
  numerical predictions, covariance treatment, target data, or fitted
  parameter count.

source_descriptor:
  channel: cross
  combination: even
  coordinate: p
  orientation_order: first_minus_second
  normalization: angular_normalized
  quantity: orientation_contrast

target_descriptor:
  channel: cross
  combination: even
  coordinate: p
  orientation_order: first_minus_second
  normalization: angular_normalized
  quantity: orientation_contrast

exact_registered_map:
  identity: identical normalized P4[S_prime] descriptor
  scale: 1.0
  offset: 0.0
  rationale: >-
    The training/source and held-out target both use the cross-channel,
    matching-even, size-local angular-normalized P4[S_prime] convention. No
    cross/either conversion or cross-size angular factor is applied.

semantic_requirements:
  - validate the map before invoking the frozen scoring kernel
  - fail unless the registered transform has scale one and offset zero
  - require an output path so the authoritative score can be annotated
  - append source_descriptor target_descriptor and applied_transform to output
  - do not rewrite either 2026-08-28 frozen artifact

scientific_invariants_unchanged:
  - target_sizes_185_and_265
  - leading_power_5_over_4
  - training_sizes_65_85_130
  - target_refit_parameters_zero
  - frozen_model_order
  - source_plus_target_covariance
